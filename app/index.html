<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b0a09">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Wing Console</title>
<style>
/* Layout: fixed 1180-wide console, scaled to fill the device in landscape; height stretches to the screen so faders and the EQ graph grow on taller devices. */
:root{
  --ground:#121110; --panel:#1a1815; --ink:#f1e7d2; --ink-dim:#b8a78a;
  --brass:#c9a25a; --brass-hi:#f3c27a; --line:#2c2721;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#0b0a09;color:var(--ink);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box}
button{font-family:var(--display);-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
#stage{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#0b0a09}
.console{position:absolute;top:0;width:1180px;transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--ground);font-family:var(--display);color:var(--ink)}
.wood{background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 2px,transparent 2px 7px),linear-gradient(90deg,#3a2213,#6e4527 45%,#55331b 70%,#2e1b0f)}
.topbar{flex:none;display:flex;align-items:center;gap:12px;padding-right:14px;background:linear-gradient(180deg,#2b2723,#1a1815);border-bottom:1px solid #8a6a3a}
.navbtn{width:60px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:1px solid transparent;border-radius:8px;color:#e9dcc2;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.navbtn.hot{background:#2a2014;border-color:#8a6a3a;color:var(--brass-hi);width:66px}
.strip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;padding:6px;background:linear-gradient(180deg,#27241f,#1a1815 60%,#161412);border:1px solid #302b25;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cname{height:26px;flex:none;border:none;border-radius:3px;padding:0 6px;color:#121110;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.panmini{position:relative;height:30px;flex:none;padding:0;border:1px solid #34302a;border-radius:15px;background:#100f0d;cursor:ew-resize;touch-action:none}
.knob{position:absolute;top:50%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e3b4,#c9a25a 55%,#7a5a26);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.ms{display:flex;gap:4px;height:32px;flex:none}
.ms button{flex:1;min-width:0;padding:0;border-radius:4px;font-weight:700;font-size:13px;letter-spacing:.08em;cursor:pointer}
.dbr{height:14px;flex:none;text-align:center;font-family:var(--mono);font-size:11px;line-height:14px;color:#d9cdb3}
.fader{position:relative;width:100%;flex:none;padding:0;border:none;background:transparent;cursor:ns-resize;touch-action:none}
.mk{position:absolute;left:0;width:22px;text-align:right;font-family:var(--mono);font-size:9px;line-height:14px;color:#9b927f}
.tk{position:absolute;left:30px;width:28px;height:1px;background:#3a342c}
.slot{position:absolute;left:41px;width:6px;top:20px;bottom:20px;border-radius:3px;background:#070606;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 0 0 1px #2c2721}
.meter{position:absolute;left:68px;width:9px;top:22px;display:flex;flex-direction:column;gap:2px}
.meter span{flex:1;border-radius:1px}
.cap{position:absolute;left:24px;width:40px;height:44px;border-radius:5px;background:linear-gradient(180deg,#f4ecda 0%,#ddd3bc 40%,#b9ad93 50%,#d6ccb4 60%,#ece4d0 100%);border:1px solid #6f6656;box-shadow:0 6px 8px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.7)}
.cap::after{content:"";position:absolute;left:3px;right:3px;top:20px;height:2px;background:#1b1915}
.layer{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:6px;border:1px solid #302b25;background:#1a1815;color:#e9dcc2;font-weight:600;font-size:19px;letter-spacing:.03em;cursor:pointer}
.layer i{width:4px;height:26px;border-radius:2px;background:#4a4339}
.layer.on{background:#2a2014;color:var(--brass-hi);border-color:var(--brass)}
.layer.on i{background:#e8a33d}
.scrim{position:absolute;inset:0;border:none;padding:0;background:rgba(8,7,6,.72);cursor:default}
.pop{position:absolute;display:flex;flex-direction:column;background:linear-gradient(180deg,#2a2622,#1a1815);border:1px solid #5a4630;border-radius:12px;box-shadow:0 30px 60px rgba(0,0,0,.7)}
.tag{height:26px;padding:0 12px;display:flex;align-items:center;border-radius:3px;color:#121110;font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.pill{height:44px;border-radius:8px;border:1px solid #3a342c;background:#1a1815;color:#e9dcc2;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pill.on{background:#2a2014;color:var(--brass-hi);border-color:var(--brass)}
.box{position:relative;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-radius:6px;border:1px solid var(--line);background:#141210;cursor:ew-resize;touch-action:none;overflow:hidden;height:44px}
.box b{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#9b927f}
.box em{font-style:normal;font-family:var(--mono);font-size:15px;color:var(--ink)}
.box.big b{font-size:15px}.box.big em{font-size:21px}
.box s{position:absolute;left:0;bottom:0;height:3px;text-decoration:none}
.sec{min-width:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.tab{height:36px;display:flex;align-items:center;gap:5px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:#cbbd9f;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab.on{background:#2a2014;color:var(--brass-hi);border-color:var(--brass)}
.small{height:36px;padding:0 12px;border-radius:6px;border:1px solid #3a342c;background:#151311;color:#e9dcc2;font-weight:600;font-size:15px;letter-spacing:.08em;cursor:pointer}
.gl{position:absolute;font-family:var(--mono);font-size:11px;color:#8fa3aa;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2a2420,#0b0a09 75%);z-index:20;padding:24px}
.card{max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;font-family:'Heebo',var(--display)}
.card h1{margin:0;font-family:var(--display);font-size:44px;letter-spacing:.12em;color:var(--brass-hi);font-weight:700}
.card p{margin:0;color:#d9cdb3;font-size:17px;line-height:1.5}
.cta{min-height:56px;padding:0 34px;border-radius:12px;border:1px solid var(--brass);background:#2a2014;color:var(--brass-hi);font-family:'Heebo',var(--display);font-size:20px;font-weight:700;cursor:pointer}
.ghost{min-height:44px;padding:0 20px;border-radius:10px;border:1px solid #3a342c;background:transparent;color:#cbbd9f;font-family:'Heebo',var(--display);font-size:16px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 20px;border-radius:10px;background:#2a2014;border:1px solid #8a6a3a;color:var(--brass-hi);font-family:'Heebo',var(--display);font-size:16px;z-index:30;direction:rtl;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="stage"></div>
<script type="module">
import { html, render, Component } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';

const DW = 1180;
/* Present only inside the Android app: a READ-ONLY link to the mixer (it can only ask for values). */
const NATIVE = window.WingNative || null;
const APK_URL = 'https://github.com/netchamo/wing-console/releases/download/latest/wing-console.apk';
/* WING colour index (1–12) → strip colour. Approximate until checked on the console. */
const WING_COLORS = ['#8c9bb0', '#5f8fd6', '#4fb0d6', '#4fc9b7', '#62b85c', '#a5c94f', '#d9c86a', '#e8a33d', '#e07a6e', '#e05a8a', '#c47ad9', '#8a7ad9'];
const chAddr = i => i < 40 ? '/ch/' + (i + 1) : '/aux/' + (i - 39);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const IC = {
  player: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><circle cx="15.5" cy="11" r="2"/><path d="M8.5 11h7M6 19l1.5-3h9L18 19"/></svg>`,
  fx: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0"/></svg>`,
  route: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>`,
  scenes: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
  full: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`,
  unfull: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>`,
  back: html`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`,
  grip: html`<svg width="8" height="14" viewBox="0 0 8 14" fill="#7d7363" aria-hidden="true"><circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/><circle cx="2" cy="7" r="1.2"/><circle cx="6" cy="7" r="1.2"/><circle cx="2" cy="12" r="1.2"/><circle cx="6" cy="12" r="1.2"/></svg>`
};

function dbOf(v) {
  if (v <= 0.001) return -Infinity;
  if (v >= 0.5) return v * 40 - 30;
  if (v >= 0.25) return v * 80 - 50;
  if (v >= 0.0625) return v * 160 - 70;
  return v * 480 - 90;
}
const dbText = v => { const d = dbOf(v); return d === -Infinity ? '-∞' : (d > 0 ? '+' : '') + d.toFixed(1); };
const panText = p => Math.abs(p) < 0.01 ? 'C' : (p < 0 ? 'L' : 'R') + Math.round(Math.abs(p) * 100);
const fmtF = f => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + ' kHz' : Math.round(f) + ' Hz';
const fmtDb = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + ' dB';
const capture = e => { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} };

/* Input groups. hasPre = the source has an analog preamp (gain + 48V). Counts and the gain range are placeholders until checked against the protocol document. */
const GROUPS = [
  { id: 'LCL', name: 'Local', short: 'LCL', n: 8 }, { id: 'AUX', name: 'Aux in', short: 'AUX', n: 8 },
  { id: 'A', name: 'AES50 A', short: 'A', n: 48 }, { id: 'B', name: 'AES50 B', short: 'B', n: 48 }, { id: 'C', name: 'AES50 C', short: 'C', n: 48 },
  { id: 'SC', name: 'StageConnect', short: 'SC', n: 32 }, { id: 'USB', name: 'USB', short: 'USB', n: 48 },
  { id: 'CRD', name: 'Card · Dante', short: 'DANTE', n: 64 }, { id: 'MOD', name: 'Module', short: 'MOD', n: 48 }, { id: 'PLY', name: 'Player', short: 'PLY', n: 2 }
];
const GMAP = Object.fromEntries(GROUPS.map(g => [g.id, g]));
const PRE = new Set(['LCL', 'A', 'B', 'C']);
const GMIN = -2.5, GSTEP = 2.5, GSTEPS = 19;
const MODES = [['M', 'Mono'], ['ST', 'Stereo'], ['MS', 'M/S']];
const STAGE = ['Kick In','Snare','Hi-Hat','Tom 1','OH L','OH R','Bass DI','Gtr Amp','Keys L','Keys R','Vox 1','Vox 2'];
const DCAS = ['Drums','Bass','Gtrs','Keys','Vox','FX'];
const pad2 = n => String(n).padStart(2, '0');
const srcKey = s => s.grp + '-' + s.n;
const arcPath = (a0, a1, r, c) => {
  const P = a => { const t = (a - 90) * Math.PI / 180; return [(c + r * Math.cos(t)).toFixed(1), (c + r * Math.sin(t)).toFixed(1)]; };
  const [x0, y0] = P(a0), [x1, y1] = P(a1);
  return `M ${x0} ${y0} A ${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} 1 ${x1} ${y1}`;
};

function makeChannels() {
  const names = [['Kick','#e07a6e'],['Snare','#e0a35e'],['Hi-Hat','#d9c86a'],['Toms','#e0a35e'],['OH L','#d9c86a'],['OH R','#d9c86a'],['Bass','#8cc47e'],['Gtr','#6cc0b8'],['Keys L','#7aa7e0'],['Keys R','#7aa7e0'],['Vox 1','#e58fb5'],['Vox 2','#e58fb5']];
  const vs = [0.72,0.7,0.6,0.66,0.62,0.62,0.75,0.68,0.64,0.64,0.78,0.7];
  const ps = [0,0,0.3,-0.2,-0.6,0.6,0,-0.35,-0.8,0.8,0,0.15];
  const out = [];
  for (let i = 0; i < 48; i++) {
    const n = names[i];
    const sends = [];
    for (let k = 0; k < 24; k++) sends.push(n && k < 4 ? 0.5 + ((i * 7 + k * 3) % 5) * 0.05 : 0);
    out.push({ name: n ? n[0] : (i < 40 ? 'Ch ' + (i + 1) : 'Aux ' + (i - 39)), color: n ? n[1] : (i < 40 ? '#8c9bb0' : '#a993d9'),
      v: n ? vs[i] : 0, pan: n ? ps[i] : 0, width: 1, swap: false, mute: false, solo: false, sends, base: 0.55 + ((i * 37) % 30) / 100 });
  }
  return out;
}
function makeEq() {
  const spec = []; let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let k = 0; k < 120; k++) {
    const f = 20 * Math.pow(10, 3 * k / 119);
    const base = f < 120 ? 0.12 : f < 400 ? 0.12 + (f - 120) / 280 * 0.5 : f < 6000 ? 0.62 - (f - 400) / 5600 * 0.12 : 0.5 - (f - 6000) / 14000 * 0.2;
    spec.push(Math.max(0.03, base + (rnd() - 0.5) * 0.28));
  }
  return {
    bands: [
      { id: 'L', type: 'losh', f: 90, g: 0, q: 0.7, on: true, dyn: false, thr: -30, range: -6, att: 5, rel: 120, color: '#7aa7e0' },
      { id: '1', type: 'bell', f: 2050, g: -3.7, q: 2.12, on: true, dyn: false, thr: -20, range: -6, att: 3, rel: 80, color: '#ef6f5a' },
      { id: '2', type: 'bell', f: 1250, g: -2.2, q: 3.2, on: true, dyn: false, thr: -24, range: -4, att: 5, rel: 120, color: '#f0a24a' },
      { id: '3', type: 'bell', f: 920, g: -3.5, q: 7, on: true, dyn: false, thr: -24, range: -4, att: 5, rel: 120, color: '#d6d860' },
      { id: '4', type: 'bell', f: 165, g: -3.2, q: 1.4, on: true, dyn: false, thr: -24, range: -4, att: 10, rel: 150, color: '#4fc9b7' },
      { id: 'H', type: 'hish', f: 9000, g: 1.5, q: 0.7, on: true, dyn: false, thr: -30, range: 4, att: 5, rel: 120, color: '#a993d9' }
    ],
    sel: 1, fs: false, R: 12, bypass: false, listen: false, pre: true,
    lc: { on: true, f: 60 }, hc: { on: false, f: 16000 }, tilt: 0,
    spec, base: spec.slice(), bl: [-40,-40,-40,-40,-40,-40], mIn: 60, mOut: 55
  };
}

/* Dynamics-slot models. Names taken from published firmware notes; the full list and each model's parameters get checked against the protocol document. */
const DEQ = 'Dual Dynamic EQ';
const TABS = ['Home', 'Config', 'Gate', 'EQ', 'Comp', 'Ins 1', 'Ins 2', 'Sends'];
const NOGRIP = new Set(['Home', 'Config', 'Sends']);
const SEND_LBL = ['Mon Vox','Mon Gtr','Mon Keys','Mon Drums','IEM 1','IEM 2','Reverb','Delay','Bus 9','Bus 10','Bus 11','Bus 12','Bus 13','Bus 14','Bus 15','Bus 16'];
const RATIO_N = { '1:1.5': 1.5, '1:2': 2, '1:3': 3, '1:4': 4, 'GATE': Infinity };
const GATE_DEF = { thr: -40, range: 40, att: 10, hld: 10, rel: 199, acc: 0, 'sc.f': 1000, 'sc.q': 1 };
const KEYT = { LC6: 'Lo-Cut 6dB', LC12: 'Lo-Cut 12dB', HC6: 'Hi-Cut 6dB', HC12: 'Hi-Cut 12dB', BP: 'Band Q' };
const MODELS = [
  { name: 'Wing Gate', kind: 'Gate' }, { name: 'Wing Expander', kind: 'Expander' }, { name: 'Wing Comp', kind: 'Compressor' },
  { name: 'BDX 160', kind: 'Compressor' }, { name: 'LA Leveler', kind: 'Leveler' }, { name: 'Even 88 Comp', kind: 'Compressor' },
  { name: 'One Knob Comp', kind: 'Compressor' }, { name: 'LMT Comp', kind: 'Compressor' }, { name: DEQ, kind: 'Dynamic EQ' }
];
function makeDeq() {
  const e = makeEq();
  return { ...e, sel: 0, lc: { on: false, f: 60 }, hc: { on: false, f: 16000 },
    bands: [
      { id: '1', type: 'bell', f: 2800, g: 0, q: 2.5, on: true, dyn: true, thr: -22, range: -5, att: 3, rel: 80, color: '#ef6f5a' },
      { id: '2', type: 'bell', f: 320, g: 0, q: 1.6, on: true, dyn: true, thr: -28, range: -4, att: 10, rel: 150, color: '#4fc9b7' }
    ] };
}

class App extends Component {
  constructor() {
    super();
    this.state = { cw: innerWidth, ch: innerHeight, started: !!NATIVE, isFs: false, toast: '', screen: 'main', eqCh: 1,
      chans: makeChannels(), main: { v: 0.75, pan: 0, width: 1, swap: false, mute: false }, bank: 0, lv: [0,0,0,0,0,0,0,0,0],
      panPop: null, sendPop: null, eq: makeEq(),
      lastTab: 'home', cfg: {}, srcs: {}, srcPop: null, balPop: null, cfgLv: [0, 0, 0],
      otherModel: { gate: 'Wing Expander', comp: 'BDX 160' }, dragPop: false, connPop: false,
      conn: { ip: (() => { try { return localStorage.getItem('wing.ip') || ''; } catch (e) { return ''; } })(), status: 'demo', name: '', model: '', fw: '', found: [], searching: false, wifi: null, lastRx: 0, update: false, live: false }, logV: 0, liveAsk: false,
      deq: makeDeq(), slots: { gate: 'Wing Gate', comp: 'Wing Comp' }, dynSlot: 'gate', modelPop: false, keyPop: false, chPick: false,
      gate: { on: true, thr: -40, range: 40, att: 10, hld: 10, rel: 199, acc: 0, ratio: '1:3', fs: false,
        sc: { on: false, type: 'BP', f: 1000, q: 1, src: 'SELF', tap: 'IN' },
        sim: { t: 0, next: 0.3, env: -62, hold: 0, gr: 40, hist: [], trail: [], lin: -62 } } };
    this.ek = 'eq';
    this.ptrs = {}; this.taps = {};
  }
  componentDidMount() {
    const ro = new ResizeObserver(() => { const r = this.stage.getBoundingClientRect(); this.setState({ cw: r.width, ch: r.height }); });
    ro.observe(this.stage);
    const fsc = () => this.setState({ isFs: !!(document.fullscreenElement || document.webkitFullscreenElement) });
    document.addEventListener('fullscreenchange', fsc); document.addEventListener('webkitfullscreenchange', fsc);
    ['gesturestart','gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
    document.addEventListener('contextmenu', e => e.preventDefault());
    this.iv = setInterval(() => this.tick(), 110);
    this.gv = setInterval(() => this.gateSim(), 50);
    if (NATIVE) {
      window.__wingNative = list => this.onNative(list);
      try { NATIVE.ready(); } catch (e) {}
      this.pv = setInterval(() => this.pollTick(), 200);
      const ip = this.state.conn.ip;
      setTimeout(() => { if (ip) this.nConnect(ip); else this.nDiscover(); }, 400);
    }
  }

  /* ---------- mixer link (Android app only, read-only) ---------- */
  isLinked() { const s = this.state.conn.status; return !!NATIVE && (s === 'connecting' || s === 'connected' || s === 'lost'); }
  logLine(dir, text) {
    const L = this.logLines || (this.logLines = []);
    L.push(new Date().toTimeString().slice(0, 8) + (dir === 'in' ? ' ← ' : dir === 'out' ? ' → ' : dir === 'err' ? ' ✗ ' : ' · ') + text);
    if (L.length > 150) L.splice(0, L.length - 150);
  }
  nConnect(ip) {
    if (!NATIVE || !ip) return;
    try { localStorage.setItem('wing.ip', ip); } catch (e) {}
    this.pollN = 0;
    this.setState(st => ({ conn: { ...st.conn, ip, status: 'connecting', lastRx: 0, connAt: Date.now(), live: false } }));
    NATIVE.connect(ip);
  }
  nDisconnect() { if (!NATIVE) return; NATIVE.disconnect(); this.setState(st => ({ conn: { ...st.conn, status: 'demo', live: false } })); }
  canSend() { return !!NATIVE && typeof NATIVE.set === 'function' && typeof NATIVE.setLive === 'function'; }
  setLive(on) {
    if (on && !this.canSend()) { this.toast('צריך להתקין את הגרסה החדשה של האפליקציה (APK) כדי לשלוט במיקסר'); this.setState({ liveAsk: false }); return; }
    if (this.canSend()) NATIVE.setLive(!!on);
    this.setState(st => ({ conn: { ...st.conn, live: !!on }, liveAsk: false }));
    this.toast(on ? 'Live control דלוק: פיידרים ומיוטים נשלחים למיקסר' : 'Live control כבוי: קריאה בלבד');
  }
  /* coalesce fast fader moves: one message per address every 30 ms */
  sendSet(addr, type, val) {
    (this.outSet || (this.outSet = {}))[addr] = [type, val];
    (this.holdUntil || (this.holdUntil = {}))[addr] = Date.now() + 700;
    if (this.outT) return;
    this.outT = setTimeout(() => {
      this.outT = null;
      const o = this.outSet; this.outSet = {};
      for (const a in o) NATIVE.set(a, o[a][0], String(o[a][1]));
    }, 30);
  }
  nDiscover() {
    if (!NATIVE) return;
    this.setState(st => ({ conn: { ...st.conn, searching: true, found: [] } }));
    NATIVE.discover(this.state.conn.ip || '');
  }
  pollTick() {
    const st = this.state, c = st.conn;
    if (!(c.status === 'connecting' || c.status === 'connected' || c.status === 'lost')) return;
    const now = Date.now();
    if (c.status === 'connected' && now - c.lastRx > 4000) this.setState(s => ({ conn: { ...s.conn, status: 'lost' } }));
    if (c.status === 'connecting' && now - (c.connAt || now) > 6000 && !c.lastRx) this.setState(s => ({ conn: { ...s.conn, status: 'lost' } }));
    const n = this.pollN = (this.pollN || 0) + 1, q = [];
    if (n % 25 === 1) for (let i = 0; i < 48; i++) q.push(chAddr(i) + '/name', chAddr(i) + '/col');
    if (n % 10 === 1) { for (let i = 0; i < 48; i++) q.push(chAddr(i) + '/fdr', chAddr(i) + '/mute'); }
    else { for (let j = 0; j < 8; j++) { const i = st.bank * 8 + j; q.push(chAddr(i) + '/fdr', chAddr(i) + '/mute'); } }
    q.push('/main/1/fdr', '/main/1/mute');
    NATIVE.query(q.join('\n'));
  }
  onNative(list) {
    const osc = [];
    let conn = null;
    const C = () => conn || (conn = { ...this.state.conn });
    for (const e of list) {
      if (e.type === 'osc') { const h = this.holdUntil && this.holdUntil[e.address]; if (!(h && Date.now() < h)) osc.push(e); else C().lastRx = Date.now(); continue; }
      if (e.type === 'log') { this.logLine(e.dir, e.text); continue; }
      if (e.type === 'net') { C().wifi = !!e.wifi; continue; }
      if (e.type === 'found') {
        const c = C(); if (!c.found.some(f => f.ip === e.ip)) c.found = [...c.found, e];
        this.logLine('in', 'found ' + e.name + ' (' + e.model + ') at ' + e.ip + ' fw ' + e.fw);
        if (!c.ip && c.status === 'demo' && c.found.length === 1) setTimeout(() => this.nConnect(e.ip), 50);
        continue;
      }
      if (e.type === 'discoverDone') { C().searching = false; if (!e.count) this.logLine('sys', 'no mixer answered'); continue; }
      if (e.type === 'status') { const c = C(); if (e.status === 'idle') c.status = 'demo'; else if (e.status === 'error') { c.status = 'demo'; this.toast(e.detail); } continue; }
      if (e.type === 'update') { C().update = true; continue; }
    }
    if (osc.length) {
      const c = C(); c.lastRx = Date.now();
      if (c.status !== 'connected') { c.status = 'connected'; this.logLine('sys', 'mixer is answering'); }
    }
    this.setState(st => {
      const out = { logV: st.logV + 1 };
      if (conn) out.conn = { ...st.conn, ...conn };
      if (osc.length) {
        const chans = st.chans.slice(); let main = st.main, touched = false;
        for (const m of osc) {
          const a = m.args || [];
          let mm = /^\/(ch|aux)\/(\d+)\/(name|col|fdr|mute)$/.exec(m.address);
          if (mm) {
            const i = mm[1] === 'ch' ? +mm[2] - 1 : 39 + +mm[2];
            if (i < 0 || i >= 48) continue;
            const ch = { ...chans[i] };
            if (mm[3] === 'fdr' && typeof a[1] === 'number') ch.v = clamp(a[1], 0, 1);
            else if (mm[3] === 'mute') ch.mute = (typeof a[2] === 'number' ? a[2] : Math.round(+a[1] || 0)) === 1;
            else if (mm[3] === 'name' && typeof a[0] === 'string') ch.name = a[0].trim() || (i < 40 ? 'Ch ' + (i + 1) : 'Aux ' + (i - 39));
            else if (mm[3] === 'col') { const k = typeof a[2] === 'number' ? a[2] : parseInt(a[0], 10); if (k >= 1 && k <= 12) ch.color = WING_COLORS[k - 1]; }
            chans[i] = ch; touched = true; continue;
          }
          mm = /^\/main\/1\/(fdr|mute)$/.exec(m.address);
          if (mm) {
            main = { ...main };
            if (mm[1] === 'fdr' && typeof a[1] === 'number') main.v = clamp(a[1], 0, 1);
            else if (mm[1] === 'mute') main.mute = (typeof a[2] === 'number' ? a[2] : Math.round(+a[1] || 0)) === 1;
          } else this.logLine('in', m.address + ' ' + JSON.stringify(a));
        }
        if (touched) out.chans = chans;
        out.main = main;
      }
      return out;
    });
  }
  tick() {
    this.setState(st => {
      const lv = st.lv.map((old, j) => {
        let t;
        if (this.isLinked()) t = 0;
        else if (j < 8) { const c = st.chans[st.bank * 8 + j]; t = (c.mute || c.v < 0.01) ? 0 : Math.min(1, c.base * Math.sqrt(c.v / 0.75) * (0.75 + Math.random() * 0.35)); }
        else t = st.main.mute ? 0 : Math.min(1, 0.68 * Math.sqrt(st.main.v / 0.75) * (0.85 + Math.random() * 0.2));
        return t > old ? t : old * 0.82;
      });
      if (st.screen === 'config' || st.screen === 'home') {
        const c = st.chans[st.eqCh], cf = this.cfgOf(st.eqCh);
        const lvl = s => { if (!s) return 0; const sv = this.srcOf(s); const g = PRE.has(s.grp) ? sv.gain : 30; return Math.min(1, (0.18 + g / 60) * (0.75 + Math.random() * 0.35)); };
        const tg = [lvl(cf.main), lvl(cf.alt), c.mute ? 0 : Math.min(1, c.base * Math.sqrt(c.v / 0.75) * (0.75 + Math.random() * 0.35))];
        return { lv, cfgLv: st.cfgLv.map((o, k) => tg[k] > o ? tg[k] : o * 0.82) };
      }
      const key = st.screen === 'eq' ? 'eq' : st.screen === 'dyn' && st.slots[st.dynSlot] === DEQ ? 'deq' : null;
      if (!key) return { lv };
      const q = st[key];
      const spec = q.base.map((b, k) => q.spec[k] * 0.5 + Math.max(0.03, b + (Math.random() - 0.5) * 0.22) * 0.5);
      const bl = q.bl.map(o => o * 0.55 + (-32 + Math.random() * 24) * 0.45);
      return { lv, [key]: { ...q, spec, bl, mIn: 55 + Math.random() * 25, mOut: 50 + Math.random() * 22 } };
    });
  }
  dims() {
    const { cw, ch } = this.state;
    const s = Math.min(cw / DW, ch / 500);
    return { s, Hd: ch / s, offX: (cw - DW * s) / 2 };
  }
  dbl(key) { const now = Date.now(); const hit = this.taps[key] && now - this.taps[key] < 320; this.taps[key] = hit ? 0 : now; return hit; }
  toast(msg) { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2600); }

  goFullscreen() {
    this.setState({ started: true });
    try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {}
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    const fail = () => this.toast('הדפדפן הזה לא מאפשר מסך מלא מכאן. אפשר להמשיך כרגיל.');
    if (!req) { fail(); return; }
    try {
      const p = req.call(el, { navigationUI: 'hide' });
      const lock = () => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (_) {} };
      if (p && p.then) p.then(lock).catch(fail); else lock();
    } catch (_) { fail(); }
  }
  toggleFullscreen() {
    if (this.state.isFs) { const x = document.exitFullscreen || document.webkitExitFullscreen; x && x.call(document); }
    else this.goFullscreen();
  }

  /* ---------- main mixer ---------- */
  get(i) { return i === -1 ? this.state.main : this.state.chans[i]; }
  upd(i, patch) {
    if (this.isLinked()) {
      if (!this.state.conn.live) { this.toast('קריאה בלבד: הדלק Live control כדי לשלוט במיקסר'); return; }
      if (Object.keys(patch).some(k => k !== 'v' && k !== 'mute')) { this.toast('הפרמטר הזה עוד לא מחובר למיקסר'); return; }
      const base = i === -1 ? '/main/1' : chAddr(i);
      if ('v' in patch) { const d = dbOf(patch.v); this.sendSet(base + '/fdr', 'f', d === -Infinity ? -144 : Math.round(clamp(d, -144, 10) * 100) / 100); }
      if ('mute' in patch) this.sendSet(base + '/mute', 'i', patch.mute ? 1 : 0);
    }
    this.setState(st => {
      if (i === -1) return { main: { ...st.main, ...patch } };
      const chans = st.chans.slice(); chans[i] = { ...chans[i], ...patch }; return { chans };
    });
  }
  faderDown(i, e, T, FH, noLong) {
    capture(e);
    if (this.dbl('f' + i)) { this.upd(i, { v: 0.75 }); this.fd = null; return; }
    const r = e.currentTarget.getBoundingClientRect();
    this.fd = { i, y: e.clientY, start: this.get(i).v, px: r.height * T / FH, moved: false };
    clearTimeout(this.ft);
    if (i !== -1 && !noLong) this.ft = setTimeout(() => { if (this.fd && !this.fd.moved) { this.fd = null; this.setState({ sendPop: { i, bank: 0 } }); } }, 500);
  }
  faderMove(e) {
    const f = this.fd; if (!f) return;
    const dy = e.clientY - f.y;
    if (!f.moved && Math.abs(dy) > 4) { f.moved = true; clearTimeout(this.ft); }
    if (f.moved) this.upd(f.i, { v: clamp(f.start - dy / f.px, 0, 1) });
  }
  faderUp() { clearTimeout(this.ft); this.fd = null; }
  panDown(i, e) {
    capture(e);
    const r = e.currentTarget.getBoundingClientRect();
    this.pd = { i, x: e.clientX, start: this.get(i).pan, w: r.width, moved: false };
    clearTimeout(this.pt);
    this.pt = setTimeout(() => { if (this.pd && !this.pd.moved) { this.pd = null; this.setState({ panPop: { i, pinned: true } }); } }, 450);
  }
  panMove(e) {
    const p = this.pd; if (!p) return;
    const dx = e.clientX - p.x;
    if (!p.moved && Math.abs(dx) > 4) { p.moved = true; clearTimeout(this.pt); this.setState({ panPop: { i: p.i, pinned: false } }); }
    if (p.moved) { let v = clamp(p.start + dx / (p.w * 1.6) * 2, -1, 1); if (Math.abs(v) < 0.03) v = 0; this.upd(p.i, { pan: v }); }
  }
  panUp() { clearTimeout(this.pt); if (this.pd && this.pd.moved) this.setState({ panPop: null }); this.pd = null; }
  bigSet(x) {
    const pp = this.state.panPop; if (!pp || !this.bp) return;
    const k = this.bp.width / 636, inner = this.bp.width - 56 * k, left = this.bp.left + 28 * k;
    let v = clamp((x - left) / inner * 2 - 1, -1, 1); if (Math.abs(v) < 0.04) v = 0;
    this.upd(pp.i, { pan: v });
  }
  wSet(x) {
    const pp = this.state.panPop; if (!pp || !this.wr) return;
    const pad = 20 * this.wr.width / 374;
    let w = clamp((x - this.wr.left - pad) / (this.wr.width - 2 * pad), 0, 1) * 2; if (Math.abs(w - 1) < 0.04) w = 1;
    this.upd(pp.i, { width: w });
  }
  sendSet(k, y) {
    const sp = this.state.sendPop; if (!sp || !this.sr) return;
    const v = clamp(1 - ((y - this.sr.top) / this.sr.height * 200 - 26) / 148, 0, 1);
    const idx = sp.bank * 8 + k, i = sp.i;
    this.setState(st => { const chans = st.chans.slice(); const s = chans[i].sends.slice(); s[idx] = v; chans[i] = { ...chans[i], sends: s }; return { chans }; });
  }

  renderMain(Hd) {
    const st = this.state, b = st.bank;
    const FH = Math.round(Hd - 216), T = FH - 44;
    const marks = [[1,'+10'],[0.875,'+5'],[0.75,'0'],[0.625,'-5'],[0.5,'-10'],[0.375,'-20'],[0.25,'-30'],[0.125,'-50'],[0,'-∞']]
      .map(m => { const c = Math.round((1 - m[0]) * T + 22); return { label: m[1], top: c - 7, tick: c }; });
    const segs = lv => { const o = []; for (let s = 17; s >= 0; s--) { const lit = lv > s / 18; o.push(s >= 16 ? (lit ? '#e0513f' : '#2f1714') : s >= 12 ? (lit ? '#e8a33d' : '#2f2414') : (lit ? '#62b85c' : '#16261a')); } return o; };
    const strip = (i, c, j, isMain) => html`
      <div class="strip" style=${isMain ? 'margin-left:8px;border-color:#6a5232' : ''}>
        <button class="cname" style=${'background:' + (isMain ? '#d9b56a' : c.color)} aria-label=${'Open ' + (isMain ? 'Main LR' : c.name)}
          onClick=${() => { if (!isMain) this.setState({ screen: this.state.lastTab, eqCh: i }); }}>${isMain ? 'Main LR' : c.name}</button>
        <button class="panmini" aria-label=${'Pan ' + panText(c.pan)}
          onPointerDown=${e => this.panDown(i, e)} onPointerMove=${e => this.panMove(e)} onPointerUp=${() => this.panUp()} onPointerCancel=${() => this.panUp()}>
          <span style="position:absolute;left:50%;top:7px;bottom:7px;width:1px;background:#4a4339"></span>
          <span style="position:absolute;left:12px;right:12px;top:0;bottom:0">
            <span class="knob" style=${`left:${(c.pan + 1) / 2 * 100}%;width:18px;height:18px;margin:-9px 0 0 -9px`}></span>
          </span>
        </button>
        <div class="ms">
          <button onClick=${() => this.upd(i, { mute: !c.mute })} aria-pressed=${String(c.mute)}
            style=${c.mute ? 'background:#d0392b;color:#fff6ee;border:1px solid #4a2420;box-shadow:0 0 12px rgba(208,57,43,.55)' : 'background:#2a1513;color:#d48a80;border:1px solid #4a2420'}>MUTE</button>
          ${!isMain && html`<button onClick=${() => this.upd(i, { solo: !c.solo })} aria-pressed=${String(c.solo)}
            style=${c.solo ? 'background:#e8b93a;color:#1a1405;border:1px solid #4a3d1a;box-shadow:0 0 12px rgba(232,185,58,.5)' : 'background:#2a2410;color:#d9bd6a;border:1px solid #4a3d1a'}>SOLO</button>`}
        </div>
        <div class="dbr">${dbText(c.v)}</div>
        <button class="fader" style=${'height:' + FH + 'px'} aria-label=${'Fader ' + dbText(c.v) + ' dB'}
          onPointerDown=${e => this.faderDown(i, e, T, FH)} onPointerMove=${e => this.faderMove(e)} onPointerUp=${() => this.faderUp()} onPointerCancel=${() => this.faderUp()}>
          ${marks.map(m => html`<span class="mk" style=${'top:' + m.top + 'px'}>${m.label}</span><span class="tk" style=${'top:' + m.tick + 'px'}></span>`)}
          <span class="slot"></span>
          <span class="meter" style=${'height:' + T + 'px'}>${segs(st.lv[j]).map(bg => html`<span style=${'background:' + bg}></span>`)}</span>
          <span class="cap" style=${'top:' + Math.round((1 - c.v) * T) + 'px'}></span>

    for (let j = 0; j < 8; j++) strips.push(strip(b * 8 + j, st.chans[b * 8 + j], j, false));

      <header class="topbar" style="height:56px">

        <div style="display:flex;flex-direction:column;line-height:1;gap:2px">
          <span style="font-size:11px;letter-spacing:.16em;color:#b8a78a;text-transform:uppercase">Mixer · Main</span>

        </div>
        ${this.connPill()}
        <div style="flex:1;display:flex;justify-content:center">
          <span style="font-family:var(--mono);font-size:12px;color:#cbbd9f;padding:6px 14px;border:1px solid #3a342c;border-radius:999px;background:#151311">SCENE · [SCENE NAME]</span>
        </div>
        <nav style="display:flex;gap:6px">
          <button class="navbtn hot" onClick=${() => this.toast('מסך הנגן וההקלטה הוא השלב הבא')}>${IC.player}<span>Player</span></button>
          <button class="navbtn" onClick=${() => this.toast('עוד לא נבנה')}>${IC.fx}<span>FX</span></button>
          <button class="navbtn" onClick=${() => this.toast('עוד לא נבנה')}>${IC.route}<span>Routing</span></button>
          <button class="navbtn" onClick=${() => this.toast('עוד לא נבנה')}>${IC.scenes}<span>Scenes</span></button>
          <button class="navbtn" onClick=${() => this.toggleFullscreen()} aria-label="Toggle full screen">${IC.full}<span>${st.isFs ? 'Exit' : 'Full'}</span></button>
        </nav>
      </header>
      <div style="flex:1;min-height:0;display:flex;gap:8px;padding:10px 0">
        <div class="wood" style="width:18px;flex:none;box-shadow:inset -2px 0 4px rgba(0,0,0,.5)"></div>
        <div style="flex:1;min-width:0;display:flex;gap:6px">${strips}</div>
        <div style="width:140px;flex:none;display:flex;flex-direction:column;gap:6px">
          <span style="font-size:11px;letter-spacing:.16em;color:#b8a78a;text-transform:uppercase;padding:2px 4px">Layers</span>
          ${banks.map((l, n) => html`<button class=${'layer' + (n === b ? ' on' : '')} onClick=${() => this.setState({ bank: n, lv: [0,0,0,0,0,0,0,0,0] })}><i></i>${l}</button>`)}

        <button class="scrim" style="z-index:8" aria-label="Cancel" onClick=${() => this.setState({ liveAsk: false })}></button>
        <div class="pop" role="alertdialog" aria-labelledby="liveT" style=${`z-index:9;left:340px;top:${Math.round((Hd - 250) / 2)}px;width:500px;padding:22px;gap:14px;border-color:#ff7a3d`}>
          <span id="liveT" style="font-size:24px;font-weight:700;letter-spacing:.04em;color:#ffb08a">Turn on live control?</span>
          <span dir="rtl" style="font-family:'Heebo',sans-serif;font-size:16px;line-height:1.55;color:#d9cdb3">מרגע זה, הזזת פיידר ולחיצה על Mute ישנו את המיקסר עצמו. כל שאר המסכים עדיין במצב דוגמה ולא שולחים כלום.</span>
          <div style="display:flex;gap:10px">
            <button class="pill" style="flex:1;height:50px" onClick=${() => this.setState({ liveAsk: false })}>Cancel</button>
            <button class="pill" style="flex:1;height:50px;background:#ff7a3d;color:#1a0d05;border-color:#ff7a3d" onClick=${() => this.setLive(true)}>Turn on</button>
          </div>
        </div>`}

  }

  renderSends(Hd) {
    const st = this.state, sp = st.sendPop, sc = st.chans[sp.i], sb = sp.bank;
    const lbls = [['Mon Vox','Mon Gtr','Mon Keys','Mon Drums','IEM 1','IEM 2','Reverb','Delay'],
      ['Bus 9','Bus 10','Bus 11','Bus 12','Bus 13','Bus 14','Bus 15','Bus 16'],['Mtx 1','Mtx 2','Mtx 3','Mtx 4','Mtx 5','Mtx 6','Mtx 7','Mtx 8']];
    const bl = ['Bus 1–8','Bus 9–16','Matrix 1–8'];
    const close = () => this.setState({ sendPop: null });
    return html`

  renderPan(Hd) {

  /* ---------- EQ ---------- */
  eqGeo(Hd) { const fs = this.state[this.ek].fs; return { W: 1102, H: Math.round(fs ? Hd - 122 : Hd - 244), pad: 16 }; }
  X(f) { return this.g.W * Math.log10(f / 20) / 3; }
  F(x) { return 20 * Math.pow(10, 3 * clamp(x, 0, this.g.W) / this.g.W); }
  Y(db) { const g = this.g; return g.H / 2 - db / this.state[this.ek].R * (g.H / 2 - g.pad); }
  G(y) { const g = this.g; return (g.H / 2 - y) / (g.H / 2 - g.pad) * this.state[this.ek].R; }
  liveG(i) { const q = this.state[this.ek], b = q.bands[i]; return b.dyn ? b.g + b.range * Math.min(1, Math.max(0, q.bl[i] - b.thr) / 12) : b.g; }
  resp(b, f, g) {
    if (!b.on) return 0;
    const r = f / b.f;
    if (b.type === 'bell') return g / (1 + Math.pow(b.q * (r - 1 / r), 2));
    if (b.type === 'losh') return g / (1 + r * r);
    if (b.type === 'hish') return g / (1 + 1 / (r * r));
    return -30 / (1 + Math.pow(b.q * 2 * (r - 1 / r), 2));
  }
  filt(f) {
    const q = this.state[this.ek]; let d = 0;
    if (q.lc.on) d += -10 * Math.log10(1 + Math.pow(q.lc.f / f, 4));
    if (q.hc.on) d += -10 * Math.log10(1 + Math.pow(f / q.hc.f, 4));
    return d + q.tilt * Math.log10(f / 1000) / Math.log10(20);
  }
  path(fn) {
    const g = this.g, N = 220; let s = '';
    for (let k = 0; k <= N; k++) { const f = 20 * Math.pow(10, 3 * k / N); s += (k ? ' L ' : 'M ') + (g.W * k / N).toFixed(1) + ' ' + clamp(this.Y(fn(f)), 2, g.H - 2).toFixed(1); }
    return s;
  }
  updEq(patch) { const k = this.ek; this.setState(st => ({ [k]: { ...st[k], ...(typeof patch === 'function' ? patch(st[k]) : patch) } })); }
  updBand(i, patch) { this.updEq(q => { const bands = q.bands.slice(); bands[i] = { ...bands[i], ...patch }; return { bands }; }); }
  ptrDown(e) {
    this.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(this.ptrs);
    if (ids.length === 2) { const a = this.ptrs[ids[0]], b = this.ptrs[ids[1]]; this.pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, q0: this.state[this.ek].bands[this.state[this.ek].sel].q }; this.drag = null; }
  }
  gMove(e) {
    if (this.ptrs[e.pointerId]) this.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (this.pinch) {
      const ids = Object.keys(this.ptrs); if (ids.length < 2) return;
      const a = this.ptrs[ids[0]], b = this.ptrs[ids[1]];
      this.updBand(this.state[this.ek].sel, { q: +clamp(this.pinch.q0 * this.pinch.d0 / Math.hypot(a.x - b.x, a.y - b.y), 0.3, 16).toFixed(2) });
      return;
    }
    const dr = this.drag; if (!dr) return;
    const dx = (e.clientX - dr.sx) / dr.scale, dy = (e.clientY - dr.sy) / dr.scale;
    if (dr.kind === 'band') {
      const p = { f: Math.round(this.F(dr.x0 + dx)) };
      if (this.ek === 'deq') p.range = Math.round(clamp(this.G(dr.y0 + dy), -15, 15) * 10) / 10;
      else if (this.state[this.ek].bands[dr.i].type !== 'notch') p.g = Math.round(clamp(this.G(dr.y0 + dy), -15, 15) * 10) / 10;
      this.updBand(dr.i, p);
    } else if (dr.kind === 'thr') {
      this.updBand(this.state[this.ek].sel, { thr: Math.round(-60 * clamp((e.clientY - dr.top) / dr.h, 0, 1) * 10) / 10 });
    } else {
      const nf = Math.round(this.F(dr.x0 + dx)), q = this.state[this.ek];
      this.updEq({ [dr.kind]: { ...q[dr.kind], f: dr.kind === 'lc' ? clamp(nf, 20, 600) : clamp(nf, 1500, 20000) } });
    }
  }
  gUp(e) { delete this.ptrs[e.pointerId]; if (Object.keys(this.ptrs).length < 2) this.pinch = null; if (!Object.keys(this.ptrs).length) this.drag = null; }
  bandDown(i, e) {
    capture(e); this.ptrDown(e);
    if (this.state[this.ek].sel !== i) this.updEq({ sel: i });
    if (this.pinch) return;
    const D = this.ek === 'deq';
    if (this.dbl('b' + i)) { this.updBand(i, D ? { range: 0 } : { g: 0 }); return; }
    const r = e.currentTarget.parentElement.getBoundingClientRect(), b = this.state[this.ek].bands[i];
    this.drag = { kind: 'band', i, sx: e.clientX, sy: e.clientY, x0: this.X(b.f), y0: this.Y(D ? b.range : b.g), scale: r.width / this.g.W };
  }
  eqBgDown(e) {
    capture(e); this.ptrDown(e);
    if (this.pinch) return;
    const q = this.state[this.ek], D = this.ek === 'deq', g = this.g, R = q.R;
    const r = e.currentTarget.getBoundingClientRect(), s = r.width / g.W;
    const mx = (e.clientX - r.left) / s, my = (e.clientY - r.top) / s;
    let best = -1, bd = 1e9;
    q.bands.forEach((b, i) => {
      const y = clamp(D ? this.Y(b.range) : b.type === 'notch' ? this.Y(-R * 0.55) : this.Y(b.g), 18, g.H - 18);
      const d = Math.hypot(this.X(b.f) - mx, (y - my) * 0.6);
      if (d < bd) { bd = d; best = i; }
    });
    if (best < 0 || bd > 150) return;
    if (q.sel !== best) this.updEq({ sel: best });
    const b = q.bands[best];
    this.drag = { kind: 'band', i: best, sx: e.clientX, sy: e.clientY, x0: this.X(b.f), y0: this.Y(D ? b.range : b.g), scale: s };
  }
  filtDown(kind, e) {
    capture(e); this.ptrDown(e);
    const r = e.currentTarget.parentElement.getBoundingClientRect();
    this.drag = { kind, sx: e.clientX, sy: e.clientY, x0: this.X(this.state[this.ek][kind].f), y0: 0, scale: r.width / this.g.W };
  }
  thrDown(e) {
    capture(e); this.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    const r = e.currentTarget.getBoundingClientRect();

  }
  NS = { f: [20, 20000, 1], g: [-15, 15], q: [0.3, 16, 1], thr: [-60, 0], range: [-18, 18], att: [0.5, 100, 1], rel: [10, 2000, 1], lc: [20, 600, 1], hc: [1500, 20000, 1], tilt: [-6, 6] };
  norm(k, v) { const [a, b, lg] = this.NS[k]; return lg ? Math.log(v / a) / Math.log(b / a) : (v - a) / (b - a); }
  denorm(k, n) { const [a, b, lg] = this.NS[k]; n = clamp(n, 0, 1); return lg ? a * Math.pow(b / a, n) : a + n * (b - a); }
  getVal(k) { const q = this.state[this.ek]; if (k === 'lc' || k === 'hc') return q[k].f; if (k === 'tilt') return q.tilt; return q.bands[q.sel][k]; }
  setVal(k, v) {
    const q = this.state[this.ek];
    if (k === 'lc' || k === 'hc') return this.updEq({ [k]: { ...q[k], f: Math.round(v) } });
    if (k === 'tilt') return this.updEq({ tilt: Math.round(v * 10) / 10 });
    this.updBand(q.sel, { [k]: k === 'f' || k === 'rel' ? Math.round(v) : k === 'q' ? Math.round(v * 100) / 100 : Math.round(v * 10) / 10 });
  }
  box(k, label, value, color, op, extraStyle) {
    return html`<button class="box" style=${`opacity:${op};${extraStyle || ''}`} aria-label=${label + ' ' + value + ', drag sideways'}
      onPointerDown=${e => { capture(e); const r = e.currentTarget.getBoundingClientRect(); this.nd = { k, sx: e.clientX, n0: this.norm(k, this.getVal(k)), w: r.width, moved: false }; }}
      onPointerMove=${e => { const d = this.nd; if (!d) return;

        this.setVal(d.k, this.denorm(d.k, d.n0 + (e.clientX - d.sx) / (d.w * 2.2))); }}
      onPointerUp=${() => { this.nd = null; this.hideDragPop(); }} onPointerCancel=${() => { this.nd = null; this.hideDragPop(); }}>
      <b>${label}</b><em>${value}</em><s style=${`width:${Math.round(this.norm(k, this.getVal(k)) * 100)}%;background:${color}`}></s></button>`;
  }

  renderEQ(Hd) {
    const st = this.state, D = this.ek === 'deq', q = st[this.ek], ch = st.chans[st.eqCh];
    const activeTab = D ? (st.dynSlot === 'gate' ? 'Gate' : 'Comp') : 'EQ';
    this.g = this.eqGeo(Hd);
    const { W, H, pad } = this.g, R = q.R, si = q.sel, sb = q.bands[si];
    const majors = [50,100,200,500,1000,2000,5000,10000], minors = [30,40,60,70,80,90,300,400,600,700,800,900,3000,4000,6000,7000,8000,9000];
    const gm = majors.map(f => `M ${this.X(f).toFixed(1)} 0 V ${H}`).join(' ') + ` M 0 ${this.Y(R / 2).toFixed(1)} H ${W} M 0 ${this.Y(-R / 2).toFixed(1)} H ${W}`;
    const gn = minors.map(f => `M ${this.X(f).toFixed(1)} 0 V ${H}`).join(' ');
    let sp = `M 0 ${H}`; q.spec.forEach((v, k) => { sp += ` L ${(W * k / 119).toFixed(1)} ${(H - v * H * 0.72).toFixed(1)}`; }); sp += ` L ${W} ${H} Z`;
    const live = this.path(f => this.filt(f) + q.bands.reduce((a, b, i) => a + this.resp(b, f, this.liveG(i)), 0));
    const stat = this.path(f => this.filt(f) + q.bands.reduce((a, b) => a + this.resp(b, f, b.g), 0));
    const showDyn = sb.dyn && sb.on;

    const y0 = this.Y(0).toFixed(1);

    const summary = D ? `${sb.id} ${tname} · ${fmtF(sb.f)} · RANGE ${fmtDb(sb.range)} · Q ${sb.q.toFixed(2)} · THR ${sb.thr.toFixed(1)}`
      : `${sb.id} ${tname} · ${fmtF(sb.f)}${sb.type === 'notch' ? '' : ' · ' + fmtDb(sb.g)} · Q ${sb.q.toFixed(2)}`;

      style=${`${fs ? 'width:40px;height:32px;border-radius:16px' : 'flex:1;min-width:0;border-radius:6px'};border:2px solid ${b.color};background:${i === si ? b.color : '#141210'};color:${i === si ? '#121110' : b.color};opacity:${b.on ? 1 : 0.45};font-weight:700;font-size:${fs ? 15 : 17}px;cursor:pointer`}>${b.id}</button>`);
    const tgl = (on, label, onClick, w) => html`<button aria-pressed=${String(on)} onClick=${onClick} class="pill" style=${`${w};${on ? 'background:#f0a24a;color:#1a1405;border-color:#f0a24a' : 'background:#141210'}`}>${label}</button>`;
    const lisBtn = w => html`<button aria-pressed=${String(q.listen)} onClick=${() => this.updEq({ listen: !q.listen })} class="pill" style=${`${w};${q.listen ? 'background:#1b272b;color:#cfe0e5;border-color:#8fa3aa' : 'background:#141210'}`}>LISTEN</button>`;
    const bypBtn = (w, cls) => html`<button aria-pressed=${String(q.bypass)} onClick=${() => this.updEq({ bypass: !q.bypass })} class=${cls} style=${`${w};${q.bypass ? 'background:#3a1714;color:#ffb4a8;border-color:#d0392b' : ''}`}>BYPASS</button>`;
    const rangeBtn = h => html`<button class="small" style=${`height:${h}px;font-family:var(--mono);font-size:13px;color:#cbbd9f`} onClick=${() => { const rs = [6, 12, 18]; this.updEq({ R: rs[(rs.indexOf(q.R) + 1) % 3] }); }}>±${R} dB</button>`;
    const rtaBtn = h => html`<button class="small" style=${`height:${h}px;border-color:${q.pre ? '#7fa6b4' : '#3a342c'}`} onClick=${() => this.updEq({ pre: !q.pre })}>${q.pre ? 'RTA ON' : 'RTA OFF'}</button>`;
    const tabs = TABS;
    const dop = sb.dyn ? 1 : 0.4;
    const frow = (k, short, label, value, hasT) => {

          ${majors.map(f => html`<span class="gl" style=${`left:${Math.round(this.X(f)) - 20}px;bottom:4px;width:40px;text-align:center`}>${f >= 1000 ? f / 1000 + 'k' : f}</span>`)}
          <span class="gl" style=${`left:8px;top:${Math.round(this.Y(R / 2) - 16)}px`}>+${R / 2}</span>
          <span class="gl" style=${`left:8px;top:${Math.round(this.Y(-R / 2) + 2)}px`}>−${R / 2}</span>
          ${showDyn && !D && html`
            <span style=${`position:absolute;left:${Math.round(bx)}px;top:${Math.round(clamp(this.Y(sb.g + sb.range), 8, H - 8))}px;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);background:${sb.color};pointer-events:none`}></span>
            <span style=${`position:absolute;left:${Math.round(bx + 12)}px;top:${Math.round(clamp(this.Y(sb.g + sb.range), 8, H - 8)) - 8}px;font-size:13px;font-weight:700;letter-spacing:.06em;color:${sb.color};pointer-events:none`}>RANGE ${(sb.range > 0 ? '+' : '') + sb.range.toFixed(1)}</span>`}

          ${q.bands.map((b, i) => { const y = D ? this.Y(b.range) : b.type === 'notch' ? this.Y(-R * 0.55) : this.Y(b.g); return html`

              <span style="position:absolute;left:13px;width:10px;top:0;bottom:0;border-radius:3px;background:#0a0f11;box-shadow:0 0 0 1px #2c3c42"></span>

              <span style=${`position:absolute;left:4px;width:28px;top:${thrY}px;height:3px;margin-top:-1px;border-radius:2px;background:#f3c27a;box-shadow:0 0 6px rgba(243,194,122,.7)`}></span>
              <span style=${`position:absolute;left:30px;top:${thrY}px;margin-top:-7px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:10px solid #f3c27a`}></span>

        <div style=${`width:40px;height:${H}px;flex:none;display:flex;gap:6px;padding:4px 6px;border-radius:8px;background:#0c0b0a;border:1px solid #2c2721`}>
          ${[q.mIn, q.bypass ? q.mIn : q.mOut].map(m => html`<span style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;background:#161412;border-radius:2px"><span style=${`height:${Math.round(m)}%;border-radius:2px;background:linear-gradient(0deg,#4fc9b7,#d6d860 70%,#f0a24a)`}></span></span>`)}
        </div>

      ${!q.fs ? html`
        <div style="flex:1;min-height:0;display:flex;gap:8px;padding:10px 14px">
          <section class="sec" style="flex:480 1 0">
            <div style="display:flex;gap:6px;height:44px">${chips(44, false)}
              <button class="pill" aria-pressed=${String(sb.on)} style=${`width:64px;border-radius:6px;font-size:15px;font-weight:800;${sb.on ? `background:${sb.color};color:#121110;border:1px solid ${sb.color};box-shadow:0 0 12px ${sb.color}66` : `background:#141210;color:${sb.color};border:1px dashed ${sb.color}88;opacity:.8`}`} onClick=${() => this.updBand(si, { on: !sb.on })}>${sb.on ? 'ON' : 'OFF'}</button>
            </div>
            <div style="display:flex;gap:4px;height:44px">
              ${(D ? [['bell','Bell'],['losh','Low shelf'],['hish','High shelf']] : [['bell','Bell'],['losh','Low shelf'],['hish','High shelf'],['notch','Notch']]).map(t => html`<button class=${'pill' + (sb.type === t[0] ? ' on' : '')} style="flex:1;min-width:0;border-radius:6px;font-size:15px;font-weight:600" onClick=${() => this.updBand(si, { type: t[0] })}>${t[1]}</button>`)}
            </div>
            <div style="display:flex;gap:6px">
              ${this.box('f', 'Freq', fmtF(sb.f), sb.color, 1, 'flex:1;min-width:0')}
              ${D ? this.box('range', 'Range', fmtDb(sb.range), sb.color, 1, 'flex:1;min-width:0')
                  : this.box('g', 'Gain', sb.type === 'notch' ? '—' : fmtDb(sb.g), sb.color, sb.type === 'notch' ? 0.4 : 1, 'flex:1;min-width:0')}
              ${this.box('q', 'Q', sb.q.toFixed(2), sb.color, sb.type === 'bell' || sb.type === 'notch' ? 1 : 0.4, 'flex:1;min-width:0')}

          ${D ? html`

              ${this.box('att', 'Attack', sb.att.toFixed(1) + ' ms', '#f3c27a', 1)}
              ${this.box('rel', 'Release', Math.round(sb.rel) + ' ms', '#f3c27a', 1)}

          </section>` : html`
          <section class="sec" style="flex:360 1 0">
            ${frow('lc', 'LC', 'Low cut', fmtF(q.lc.f), true)}

          </section>`}

        <div style="flex:1;min-height:0;display:flex;align-items:center;gap:8px;padding:8px 14px">
          <div style="flex:1;min-width:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:8px;background:#0c1214;border:1px solid #22302f">
            <span style=${`width:12px;height:12px;border-radius:50%;background:${sb.color};box-shadow:0 0 8px ${sb.color}`}></span>
            <span style="font-family:var(--mono);font-size:16px;color:#e9dcc2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${summary}</span>

  }

  /* ---------- drag value pop-up (shown only while a value box is dragged) ---------- */
  showDragPop(label, color, text, pct) { this.dragInfo = { label, color, text, pct }; this.setState({ dragPop: true }); }
  hideDragPop() { if (this.state.dragPop) this.setState({ dragPop: false }); }
  fmtEq(k) {
    const v = this.getVal(k);
    if (k === 'f' || k === 'lc' || k === 'hc') return fmtF(v);
    if (k === 'g' || k === 'range' || k === 'tilt') return fmtDb(v);
    if (k === 'q') return v.toFixed(2);
    if (k === 'thr') return v.toFixed(1) + ' dB';
    if (k === 'att') return v.toFixed(1) + ' ms';
    return Math.round(v) + ' ms';
  }
  fmtGate(key) {
    const G = this.state.gate;
    if (key === 'sc.f') return fmtF(G.sc.f);
    if (key === 'sc.q') return G.sc.q.toFixed(2);
    const v = G[key];
    if (key === 'thr' || key === 'range') return v.toFixed(1) + ' dB';
    if (key === 'acc') return String(v);
    return v + ' ms';
  }
  renderDragPop() {
    const d = this.dragInfo, pct = Math.round(clamp(d.pct(), 0, 1) * 100);
    return html`<div aria-hidden="true" style="position:absolute;left:390px;top:66px;width:400px;z-index:15;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 20px 16px;border-radius:14px;background:rgba(26,24,21,.96);border:1px solid #5a4630;box-shadow:0 18px 40px rgba(0,0,0,.6)">
      <span style="font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#b8a78a">${d.label}</span>
      <span style="font-family:var(--mono);font-size:40px;line-height:1;color:var(--ink)">${d.text()}</span>
      <span style="width:100%;height:8px;border-radius:4px;background:#0c0b0a;overflow:hidden"><span style=${`display:block;height:100%;width:${pct}%;border-radius:4px;background:${d.color}`}></span></span>
    </div>`;
  }

  /* ---------- mixer connection ---------- */
  connLook() {
    const c = this.state.conn;
    if (!NATIVE || c.status === 'demo') return { dot: '#e8a33d', text: c.searching ? 'SEARCHING…' : 'DEMO · NOT CONNECTED', border: '#6a4a2a', fg: '#f3c27a' };
    if (c.status === 'connecting') return { dot: '#e8a33d', text: 'CONNECTING · ' + c.ip, border: '#6a4a2a', fg: '#f3c27a' };
    if (c.status === 'lost') return { dot: '#e0513f', text: 'NO ANSWER · ' + c.ip, border: '#7a2a22', fg: '#ff9a8a' };
    if (c.live) return { dot: '#ff7a3d', text: (c.name || 'WING') + ' · LIVE', border: '#b4502a', fg: '#ffb08a' };
    return { dot: '#62b85c', text: (c.name || 'WING') + ' · READ ONLY', border: '#3d6a36', fg: '#a6e39c' };
  }
  connPill() {
    const L = this.connLook(), c = this.state.conn;
    const tog = c.status === 'connected' && html`<button onClick=${() => c.live ? this.setLive(false) : this.setState({ liveAsk: true })} aria-pressed=${String(c.live)}
      style=${`height:40px;padding:0 12px;border-radius:8px;font-family:inherit;font-weight:700;font-size:13px;letter-spacing:.1em;cursor:pointer;${c.live ? 'background:#ff7a3d;color:#1a0d05;border:1px solid #ff7a3d;box-shadow:0 0 12px rgba(255,122,61,.5)' : 'background:#141210;color:#cbbd9f;border:1px solid #3a342c'}`}>LIVE ${c.live ? 'ON' : 'OFF'}</button>`;
    return html`${tog}<button onClick=${() => this.setState({ connPop: true })} aria-label="Mixer connection"
      style=${`height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;border:1px solid ${L.border};background:#1d1611;color:${L.fg};font-family:inherit;font-weight:700;font-size:13px;letter-spacing:.1em;cursor:pointer;max-width:300px;white-space:nowrap;overflow:hidden`}>
      <span style=${`width:10px;height:10px;flex:none;border-radius:50%;background:${L.dot};box-shadow:0 0 8px ${L.dot}`}></span>${L.text}</button>`;
  }
  renderConnPop(Hd) {
    const st = this.state, c = st.conn, close = () => this.setState({ connPop: false }), L = this.connLook();
    const setIp = v => { this.setState({ conn: { ...c, ip: v } }); try { localStorage.setItem('wing.ip', v); } catch (e) {} };
    const linked = this.isLinked();
    const H = Math.round(Hd - 40);
    if (!NATIVE) return html`
      <button class="scrim" aria-label="Close connection" onClick=${close}></button>
      <div class="pop" style=${`left:250px;top:${Math.max(30, Math.round((Hd - 380) / 2))}px;width:680px;padding:20px 22px;gap:14px;border-color:#8a6a3a`}>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:24px;font-weight:600;letter-spacing:.04em">Mixer connection</span><span style="flex:1"></span>
          <button class="small" onClick=${close}>CLOSE</button>
        </div>
        <div dir="rtl" style="font-family:'Heebo',sans-serif;font-size:16px;line-height:1.6;color:#d9cdb3">
          דפדפן לא יכול לדבר ישירות עם ה-Wing. החיבור למיקסר עובד באפליקציה לאנדרואיד. מורידים אותה מהכתובת הזו ומתקינים:
        </div>
        <div style="padding:12px 14px;border-radius:8px;background:#0e0d0b;border:1px solid #3a342c;font-family:var(--mono);font-size:14px;color:#f3c27a;user-select:text;-webkit-user-select:text;word-break:break-all">${APK_URL}</div>
        <a href=${APK_URL} target="_blank" rel="noopener" class="pill on" style="height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none">Download the Android app</a>
      </div>`;
    return html`
      <button class="scrim" aria-label="Close connection" onClick=${close}></button>
      <div class="pop" style=${`left:30px;top:20px;width:1120px;height:${H}px;padding:16px 18px;gap:12px;border-color:#8a6a3a`}>
        <div style="display:flex;align-items:center;gap:12px">
          <span style=${`width:12px;height:12px;border-radius:50%;background:${L.dot};box-shadow:0 0 8px ${L.dot}`}></span>
          <span style="font-size:24px;font-weight:600;letter-spacing:.04em">Mixer connection</span>
          <span style=${`font-weight:700;letter-spacing:.1em;color:${L.fg}`}>${L.text}</span>
          <span style="flex:1"></span>
          ${c.update && html`<button class="small" style="height:40px;border-color:#62b85c;color:#a6e39c" onClick=${() => NATIVE.reload()}>NEW VERSION · RELOAD</button>`}
          <button class="small" style="height:40px" onClick=${close}>CLOSE</button>
        </div>
        <div style="flex:1;min-height:0;display:flex;gap:14px">
          <div style="width:460px;flex:none;display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:#141210;border:1px solid #2c2721">
              <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#b8a78a">WI-FI</span>
              <span style=${`font-size:15px;color:${c.wifi === false ? '#ff9a8a' : '#cbbd9f'}`}>${c.wifi === false ? 'Not connected to Wi-Fi' : c.wifi ? 'Connected · link locked to Wi-Fi' : 'Checking…'}</span>
              <span style="flex:1"></span>
              <button class="small" style="height:38px" onClick=${() => NATIVE.openWifi()}>WI-FI</button>
            </div>
            <div style="display:flex;gap:8px;align-items:stretch">
              <label for="wingIp" style="display:flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.14em;color:#b8a78a">IP</label>
              <input id="wingIp" inputmode="decimal" placeholder="192.168.1.62" value=${c.ip} onInput=${e => setIp(e.currentTarget.value.trim())}
                style="flex:1;min-width:0;height:48px;padding:0 12px;border-radius:8px;border:1px solid #3a342c;background:#0e0d0b;color:var(--ink);font-family:var(--mono);font-size:19px;user-select:text;-webkit-user-select:text;touch-action:manipulation"/>
              ${linked ? html`<button class="pill" style="width:130px;height:48px" onClick=${() => this.nDisconnect()}>DISCONNECT</button>`
                       : html`<button class="pill on" style="width:130px;height:48px" onClick=${() => this.nConnect(c.ip)}>CONNECT</button>`}
            </div>
            <button class="pill" style="height:46px" onClick=${() => this.nDiscover()} disabled=${c.searching}>${c.searching ? 'Searching the network…' : 'Find mixers on this network'}</button>
            <div style="display:flex;flex-direction:column;gap:6px">
              ${c.found.map(f => html`<button onClick=${() => this.nConnect(f.ip)}
                style=${`height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:8px;cursor:pointer;text-align:left;${f.ip === c.ip && linked ? 'background:#1d2a19;border:1px solid #62b85c;color:#a6e39c' : 'background:#141210;border:1px solid #3a342c;color:#e9dcc2'}`}>
                <span style="font-size:18px;font-weight:700">${f.name || 'WING'}</span>
                <span style="font-family:var(--mono);font-size:14px;color:#cbbd9f">${f.ip}</span>
                <span style="flex:1"></span><span style="font-size:12px;color:#9b927f">${f.model} · ${f.fw}</span></button>`)}
            </div>
            <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:#141210;border:1px solid #2c2721">
              <span style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#b8a78a">LIVE CONTROL</span>
              <span style="flex:1;font-size:14px;color:#9b927f">${c.live ? 'On. Faders and mutes go to the mixer.' : 'Off. Reading only, nothing is sent.'}</span>
              <button class="small" disabled=${c.status !== 'connected'} onClick=${() => c.live ? this.setLive(false) : this.setState({ liveAsk: true })}
                style=${`height:38px;${c.live ? 'background:#ff7a3d;color:#1a0d05;border-color:#ff7a3d' : ''}`}>${c.live ? 'TURN OFF' : 'TURN ON'}</button>

            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:13px;font-weight:700;letter-spacing:.14em;color:#b8a78a">DIAGNOSTICS</span>
              <span style="font-size:12px;color:#8a8170">App ${(() => { try { return NATIVE.version(); } catch (e) { return ''; } })()}</span>

          </div>

  }

  /* ---------- channel home (overview) ---------- */
  miniEq(key, W, H) {
    const sg = this.g, sk = this.ek;
    this.ek = key; this.g = { W, H, pad: 8 };
    const q = this.state[key], D = key === 'deq';
    const curve = this.path(f => (D ? 0 : this.filt(f)) + q.bands.reduce((a, b) => a + this.resp(b, f, D ? b.range : b.g), 0));
    const dots = q.bands.map(b => ({ x: this.X(b.f), y: clamp(this.Y(D ? b.range : b.g), 6, H - 6), c: b.color, on: b.on }));
    const z = this.Y(0).toFixed(1);
    this.g = sg; this.ek = sk;
    const grid = [100, 1000, 10000].map(f => `M ${(W * Math.log10(f / 20) / 3).toFixed(1)} 0 V ${H}`).join(' ');
    return html`<svg width="100%" height=${H} viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true" style="display:block">
      <path d=${grid} stroke="#1c2a30" stroke-width="1" fill="none"/>
      <path d=${`M 0 ${z} H ${W}`} stroke="#35484f" stroke-width="1" fill="none"/>
      <path d=${curve} stroke="#f6b45e" stroke-width="2.2" fill="none" opacity=${q.bypass ? 0.35 : 1}/>
      ${dots.map(d => html`<circle cx=${d.x.toFixed(1)} cy=${d.y.toFixed(1)} r="5" fill=${d.c} opacity=${d.on ? 1 : 0.3}/>`)}
    </svg>`;
  }
  miniGate(W, H) {
    const G = this.state.gate, S = G.sim, X = db => (clamp(db, -80, 0) + 80) / 80 * W, Y = db => (-clamp(db, -80, 0)) / 80 * H;
    let d = ''; for (let k = 0; k <= 80; k++) { const x = -80 + k; d += (k ? ' L ' : 'M ') + X(x).toFixed(1) + ' ' + Y(this.gateOut(x, G)).toFixed(1); }
    const open = S.gr < 3, lc = open ? '#62b85c' : '#e0513f';
    return html`<svg width="100%" height=${H} viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true" style="display:block">
      <path d=${`M 0 ${H} L ${W} 0`} stroke="#3a342c" stroke-width="1" stroke-dasharray="3 4"/>
      <path d=${d} stroke="#f6b45e" stroke-width="2.2" fill="none" opacity=${G.on ? 1 : 0.35}/>
      <circle cx=${X(G.thr)} cy=${Y(G.thr)} r="4" fill="none" stroke="#f3c27a" stroke-width="2"/>
      <circle cx=${X(S.lin).toFixed(1)} cy=${Y(S.lin - S.gr).toFixed(1)} r="6" fill=${lc}/>
    </svg>`;
  }
  miniComp(W, H) {
    const thr = -20, ratio = 3, X = db => (db + 60) / 60 * W, Y = db => (-db) / 60 * H;
    let d = ''; for (let k = 0; k <= 60; k++) { const x = -60 + k, o = x < thr ? x : thr + (x - thr) / ratio; d += (k ? ' L ' : 'M ') + X(x).toFixed(1) + ' ' + Y(o).toFixed(1); }
    return html`<svg width="100%" height=${H} viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true" style="display:block">
      <path d=${`M 0 ${H} L ${W} 0`} stroke="#3a342c" stroke-width="1" stroke-dasharray="3 4"/>
      <path d=${d} stroke="#f6b45e" stroke-width="2.2" fill="none"/>
      <circle cx=${X(thr)} cy=${Y(thr)} r="4" fill="none" stroke="#f3c27a" stroke-width="2"/>
    </svg>`;
  }
  chanStrip(Hd) {
    const st = this.state, i = st.eqCh, ch = st.chans[i];
    const FH = Math.round(Hd - 72 - 12 - 26 - 32 - 14 - 18), T = FH - 44;
    const marks = [[1,'+10'],[0.875,'+5'],[0.75,'0'],[0.625,'-5'],[0.5,'-10'],[0.375,'-20'],[0.25,'-30'],[0.125,'-50'],[0,'-∞']].map(m => ({ label: m[1], c: Math.round((1 - m[0]) * T + 22) }));
    const segs = []; for (let k = 17; k >= 0; k--) { const lit = st.cfgLv[2] > k / 18; segs.push(k >= 16 ? (lit ? '#e0513f' : '#2f1714') : k >= 12 ? (lit ? '#e8a33d' : '#2f2414') : (lit ? '#62b85c' : '#16261a')); }
    return html`
      <div class="strip" style="width:150px;flex:none">
        <span class="tag" style=${'justify-content:center;background:' + ch.color}>${ch.name}</span>
        <div class="ms">
          <button onClick=${() => this.upd(i, { mute: !ch.mute })} aria-pressed=${String(ch.mute)}
            style=${ch.mute ? 'background:#d0392b;color:#fff6ee;border:1px solid #4a2420;box-shadow:0 0 12px rgba(208,57,43,.55)' : 'background:#2a1513;color:#d48a80;border:1px solid #4a2420'}>MUTE</button>
          <button onClick=${() => this.upd(i, { solo: !ch.solo })} aria-pressed=${String(ch.solo)}
            style=${ch.solo ? 'background:#e8b93a;color:#1a1405;border:1px solid #4a3d1a;box-shadow:0 0 12px rgba(232,185,58,.5)' : 'background:#2a2410;color:#d9bd6a;border:1px solid #4a3d1a'}>SOLO</button>
        </div>
        <div class="dbr">${dbText(ch.v)}</div>
        <button class="fader" style=${`height:${FH}px;width:96px;align-self:center`} aria-label=${'Channel fader ' + dbText(ch.v) + ' dB'}
          onPointerDown=${e => this.faderDown(i, e, T, FH, true)} onPointerMove=${e => this.faderMove(e)} onPointerUp=${() => this.faderUp()} onPointerCancel=${() => this.faderUp()}>
          ${marks.map(m => html`<span class="mk" style=${'top:' + (m.c - 7) + 'px'}>${m.label}</span><span class="tk" style=${'top:' + m.c + 'px'}></span>`)}
          <span class="slot"></span>
          <span class="meter" style=${'height:' + T + 'px'}>${segs.map(bg => html`<span style=${'background:' + bg}></span>`)}</span>
          <span class="cap" style=${'top:' + Math.round((1 - ch.v) * T) + 'px'}></span>
        </button>
      </div>`;
  }

    const ph = v => html`<span style=${`padding:4px 10px;border-radius:6px;font-weight:700;font-size:14px;${v ? 'background:#d0392b;color:#fff6ee;box-shadow:0 0 10px rgba(208,57,43,.5)' : 'background:#2a1513;color:#8a5a52'}`}>+48V</span>`;
    const gV = s => s ? (this.srcOf(s).gain > 0 ? '+' : '') + this.srcOf(s).gain.toFixed(1) : '—';
    const sends = ch.sends.slice(0, 16);
    const mH = Math.max(40, h1 - 78);

    return html`
      ${this.chanHeader('Home', html`<span style="font-family:var(--mono);font-size:12px;color:#cbbd9f">CH ${pad2(i + 1)}</span>`)}
      <div style="flex:1;min-height:0;display:flex;gap:10px;padding:10px 14px">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">
          <div style=${`height:${h1}px;display:flex;gap:10px`}>
            ${tile('INPUT', cf.altOn ? 'Alt on air' : 'Main on air', null, () => this.goTab('Config'), html`
              <span style="display:flex;align-items:center;gap:8px">
                <span style=${`padding:3px 9px;border-radius:5px;font-weight:700;font-size:13px;letter-spacing:.1em;color:#121110;background:${cf.altOn ? '#e8a33d' : '#62b85c'}`}>${cf.altOn ? 'ALT' : 'MAIN'}</span>
                <span style="font-family:var(--mono);font-size:14px;color:var(--brass-hi)">${this.srcLabel(src)}</span>
              </span>
              <span style="font-size:16px;color:#e9dcc2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${this.srcName(src)}</span>
              <span style="display:flex;align-items:flex-end;gap:10px">
                <span style="display:flex;flex-direction:column;line-height:1">
                  <span style="font-size:11px;font-weight:700;letter-spacing:.14em;color:#b8a78a">GAIN</span>
                  <span style="font-family:var(--mono);font-size:30px">${pre ? gV(src) : '—'}</span>
                </span>
                ${pre && ph(sv.ph)}
              </span>
              <span style="display:flex;flex-wrap:wrap;gap:5px">
                ${chip('TRIM ' + (cf.trim > 0 ? '+' : '') + cf.trim.toFixed(1), cf.trim !== 0)}
                ${chip('Ø', cf.inv)}
                ${chip(cf.dlyOn ? 'DLY ' + cf.dly.toFixed(1) + 'ms' : 'DLY OFF', cf.dlyOn)}
              </span>
              <span style="margin-top:auto;padding-top:6px;border-top:1px solid #2c2721;display:flex;align-items:center;gap:8px;font-size:13px;color:#9b927f">
                <span style="letter-spacing:.1em">${cf.altOn ? 'MAIN' : 'ALT'} standby</span>
                <span style="font-family:var(--mono);color:#cbbd9f">${other ? this.srcLabel(other) : 'none'}</span>
                ${opre && html`<span style="font-family:var(--mono);color:#cbbd9f">${gV(other)} dB</span>`}
                ${opre && ov.ph && html`<span style="color:#ff8a7a;font-weight:700">48V</span>`}
              </span>`, 'width:250px;flex:none')}
            ${tile('GATE', gSlot, gSlot === 'Wing Gate' ? badge(st.gate.on, st.gate.on ? (st.gate.sim.gr < 3 ? 'OPEN' : 'CLOSED') : 'OFF') : null, () => this.goTab('Gate'), html`
              <span style="flex:1;min-height:0;display:flex;align-items:center;border-radius:6px;background:#0e0d0b;overflow:hidden">

              </span>
              <span style="font-family:var(--mono);font-size:13px;color:#cbbd9f">${gSlot === 'Wing Gate' ? `THR ${st.gate.thr.toFixed(0)} · ${st.gate.ratio} · R ${st.gate.range.toFixed(0)}` : gSlot === DEQ ? '2 bands' : ''}</span>`, 'width:210px;flex:none')}
            ${tile('EQ', q.bypass ? 'Bypassed' : q.bands.filter(b => b.on).length + ' bands on', null, () => this.goTab('EQ'), html`
              <span style="flex:1;min-height:0;display:flex;align-items:center;border-radius:6px;background:#0c1214;overflow:hidden">${gHas && this.miniEq('eq', 400, mH)}</span>
              <span style="display:flex;gap:5px;flex-wrap:wrap">

                ${q.bands.filter(b => b.on && Math.abs(b.g) >= 0.5).slice(0, 3).map(b => chip(b.id + ' ' + fmtF(b.f) + ' ' + (b.g > 0 ? '+' : '') + b.g.toFixed(1), true, b.color))}
              </span>`, 'flex:1')}
            ${tile('COMP', cSlot, null, () => this.goTab('Comp'), html`
              <span style="flex:1;min-height:0;display:flex;align-items:center;border-radius:6px;background:#0e0d0b;overflow:hidden">
                ${cSlot === DEQ ? this.miniEq('deq', 180, mH) : this.miniComp(180, mH)}
              </span>
              <span style="font-family:var(--mono);font-size:13px;color:#cbbd9f">${cSlot === DEQ ? '2 bands' : 'Panel coming next'}</span>`, 'width:210px;flex:none')}
          </div>
          <div style=${`height:${h2}px;display:flex;gap:10px`}>
            ${tile('SENDS', 'Bus 1–16', null, () => this.toast('לשונית ה-Sends עוד לא נבנתה'), html`
              <span style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;column-gap:18px;row-gap:3px">
                ${sends.map((v, k) => html`<span style="min-height:0;display:flex;align-items:center;gap:8px">
                  <span style="width:78px;flex:none;font-size:13px;color:${v > 0 ? '#e9dcc2' : '#6f675a'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${SEND_LBL[k]}</span>
                  <span style="flex:1;height:6px;border-radius:3px;background:#0c0b0a;overflow:hidden"><span style=${`display:block;height:100%;width:${Math.round(v * 100)}%;background:${k < 8 ? '#c9a25a' : '#7aa7e0'}`}></span></span>
                  <span style="width:44px;text-align:right;font-family:var(--mono);font-size:12px;color:#9b927f">${dbText(v)}</span>
                </span>`)}
              </span>`, 'flex:1')}
            ${tile('INSERTS', '', null, () => this.toast('לשוניות ה-Inserts עוד לא נבנו'), html`
              <span style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center">
                ${['INS 1', 'INS 2'].map(n => html`<span style="height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:7px;border:1px dashed #3a342c;background:#141210">
                  <span style="font-weight:700;letter-spacing:.1em;color:#b8a78a">${n}</span><span style="font-size:14px;color:#6f675a">Empty</span></span>`)}
              </span>`, 'width:250px;flex:none')}
          </div>
        </div>
        ${this.chanStrip(Hd)}
      </div>`;
  }

  /* ---------- gate / comp slots ---------- */
  modelBtn() {
    const st = this.state, slot = st.dynSlot, cur = st.slots[slot];

        <div style="display:flex;align-items:center;gap:12px">

  /* ---------- Wing Gate ---------- */
  chanHeader(activeTab, right) {
    const st = this.state, ch = st.chans[st.eqCh], tabs = TABS;
    return html`
      <header class="topbar" style="height:52px;gap:10px">
        <div class="wood" style="width:18px;align-self:stretch"></div>

  updGate(p) { this.setState(st => ({ gate: { ...st.gate, ...(typeof p === 'function' ? p(st.gate) : p) } })); }
  gateSim() {
    const st = this.state;
    if (!((st.screen === 'dyn' && st.slots[st.dynSlot] === 'Wing Gate') || (st.screen === 'home' && st.slots.gate === 'Wing Gate'))) return;
    const G = st.gate, s = { ...G.sim }, dt = 0.05;
    s.t += dt;
    if (s.t >= s.next) { s.env = Math.max(s.env, -8 - Math.random() * 10); s.next = s.t + 0.42 + Math.random() * 0.45; }
    if (Math.random() < 0.05) s.env = Math.max(s.env, -52 + Math.random() * 10);
    s.env = Math.max(-64 + Math.random() * 3, s.env - 75 * dt);
    const L = s.env, r = RATIO_N[G.ratio], over = L >= G.thr;
    s.hold = over ? G.hld / 1000 : Math.max(0, s.hold - dt);
    const target = !G.on || over || s.hold > 0 ? 0 : Math.min(G.range, r === Infinity ? G.range : (G.thr - L) * (r - 1));
    if (target < s.gr) s.gr = Math.max(target, s.gr - dt * 1000 * G.range / Math.max(G.att, 0.5));
    else s.gr = Math.min(target, s.gr + dt * 1000 * G.range / Math.max(G.rel, 4));
    s.lin = L;
