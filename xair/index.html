<style>
/* Layout: fixed 1180-wide console, scaled to fill the device in landscape; height stretches to the screen so faders and the EQ graph grow on taller devices. */
:root{
  --ground:#121110; --panel:#1a1815; --ink:#f1e7d2; --ink-dim:#b8a78a;

}
html,body{height:100%;margin:0;background:#0b0a09;color:var(--ink);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box}
button{font-family:var(--display);-webkit-tap-highlight-color:transparent;color:inherit}

#stage{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#0b0a09}
.console{position:absolute;top:0;width:1180px;transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--ground);font-family:var(--display);color:var(--ink)}
.wood{background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 2px,transparent 2px 7px),linear-gradient(90deg,#3a2213,#6e4527 45%,#55331b 70%,#2e1b0f)}
.topbar{flex:none;display:flex;align-items:center;gap:12px;padding-right:14px;background:linear-gradient(180deg,#2b2723,#1a1815);border-bottom:1px solid #8a6a3a}
.navbtn{width:60px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:1px solid transparent;border-radius:8px;color:#e9dcc2;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.navbtn.hot{background:#2a2014;border-color:#8a6a3a;color:var(--brass-hi);width:66px}
.strip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;padding:6px;background:linear-gradient(180deg,#27241f,#1a1815 60%,#161412);border:1px solid #302b25;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cname{height:34px;flex:none;border:none;border-radius:4px;padding:0 6px;color:#121110;font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.panmini{position:relative;height:30px;flex:none;padding:0;border:1px solid #34302a;border-radius:15px;background:#100f0d;cursor:ew-resize;touch-action:none}
.knob{position:absolute;top:50%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e3b4,#c9a25a 55%,#7a5a26);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.ms{display:flex;gap:4px;height:32px;flex:none}
.ms button{flex:1;min-width:0;padding:0;border-radius:4px;font-weight:700;font-size:13px;letter-spacing:.08em;cursor:pointer}
.dbr{height:14px;flex:none;text-align:center;font-family:var(--mono);font-size:11px;line-height:14px;color:#d9cdb3}
.fader{position:relative;width:100%;flex:none;padding:0;border:none;background:transparent;cursor:ns-resize;touch-action:none}
.mk{position:absolute;left:0;width:22px;text-align:right;font-family:var(--mono);font-size:9px;line-height:14px;color:#9b927f}
.tk{position:absolute;left:30px;width:28px;height:1px;background:#3a342c}
.slot{position:absolute;left:41px;width:6px;top:20px;bottom:20px;border-radius:3px;background:#070606;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 0 0 1px #2c2721}
.meter{position:absolute;left:66px;width:15px;top:22px;display:flex;gap:2px;padding:0;z-index:0;isolation:isolate}
.mcol{flex:1;position:relative;height:100%;border-radius:1px;overflow:hidden;background:linear-gradient(0deg,#14231a 0,#14231a 80%,#2a2212 80%,#2a2212 95%,#2e1613 95%)}
.mfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#3f9e4c 0,#7fd36b 72%,#e6c23e 80%,#f0a24a 92%,#ff4a3a 95%,#ff4a3a 100%);background-position:bottom;background-repeat:no-repeat}
.mcol::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,#0b0a09 2px 3px);pointer-events:none;z-index:2}
.mpk{position:absolute;left:0;right:0;height:2px;z-index:3}
.box em{white-space:nowrap}
.tab{white-space:nowrap}
.topbar .tag{white-space:nowrap;flex:none}
.sofrow::-webkit-scrollbar{display:none}
.cap{position:absolute;left:24px;width:40px;height:44px;border-radius:5px;background:linear-gradient(180deg,#f4ecda 0%,#ddd3bc 40%,#b9ad93 50%,#d6ccb4 60%,#ece4d0 100%);border:1px solid #6f6656;box-shadow:0 6px 8px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.7)}

.layer.on{background:#2a2014;color:var(--brass-hi);border-color:var(--brass)}
.layer.on i{background:#e8a33d}
.scrim{position:absolute;inset:0;border:none;padding:0;background:rgba(8,7,6,.72);cursor:default}

.pill{height:44px;border-radius:8px;border:1px solid #3a342c;background:#1a1815;color:#e9dcc2;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pill.on{background:#2a2014;color:var(--brass-hi);border-color:var(--brass)}
.fxk{width:104px;height:100px;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0 0;border:none;border-radius:8px;background:transparent;cursor:ns-resize;touch-action:none;color:inherit}.fxk:active{background:rgba(255,255,255,.03)}.fxkl{max-width:100px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#b8a78a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fxkv{font-family:var(--mono);font-size:12.5px;color:#f3e6cc;white-space:nowrap}.fxch{flex:none;height:100px;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 6px;border:none;background:transparent;color:inherit}.fxsec{display:flex;flex-direction:column;gap:2px;padding:6px 8px 4px;border-radius:10px;border:1px solid;background:linear-gradient(180deg,#1a1714,#121110)}.fxsect{font-size:11px;font-weight:800;letter-spacing:.2em;padding-left:4px}
.fxwet svg.fxpic{opacity:var(--wet,1);transition:opacity .12s}
.box{position:relative;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-radius:6px;border:1px solid var(--line);background:#141210;cursor:ew-resize;touch-action:none;overflow:hidden;height:44px}

.box em{font-style:normal;font-family:var(--mono);font-size:15px;color:var(--ink)}
.box.big b{font-size:15px}.box.big em{font-size:21px}
.box s{position:absolute;left:0;bottom:0;height:3px;text-decoration:none}
.sec{min-width:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.tab{height:44px;display:flex;align-items:center;gap:3px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:linear-gradient(180deg,#1e1b18,#141210);color:#d9cdb3;font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.topbar.backR>.backbtn{order:98}.topbar.backR>.wood:last-child{order:99}
.tab.on{background:#2a2014;color:var(--brass-hi);border-color:var(--brass)}
.small{height:36px;padding:0 12px;border-radius:6px;border:1px solid #3a342c;background:#151311;color:#e9dcc2;font-weight:600;font-size:15px;letter-spacing:.08em;cursor:pointer}
.gl{position:absolute;font-family:var(--mono);font-size:11px;color:#8fa3aa;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2a2420,#0b0a09 75%);z-index:20;padding:24px}
.card{max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;font-family:'Heebo',var(--display)}
.card h1{margin:0;font-family:var(--display);font-size:44px;letter-spacing:.12em;color:var(--brass-hi);font-weight:700}
.card p{margin:0;color:#d9cdb3;font-size:17px;line-height:1.5}
.cta{min-height:56px;padding:0 34px;border-radius:12px;border:1px solid var(--brass);background:#2a2014;color:var(--brass-hi);font-family:'Heebo',var(--display);font-size:20px;font-weight:700;cursor:pointer}
.ghost{min-height:44px;padding:0 20px;border-radius:10px;border:1px solid #3a342c;background:transparent;color:#cbbd9f;font-family:'Heebo',var(--display);font-size:16px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 20px;border-radius:10px;background:#2a2014;border:1px solid #8a6a3a;color:var(--brass-hi);font-family:'Heebo',var(--display);font-size:16px;z-index:30;direction:rtl;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="stage"></div>
<script type="module">
import { html, render, Component } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';

/* AIR CONSOLE – X-Air (XR12 / XR16 / XR18). See docs/XAIR-PROTOCOL.md and docs/HANDOFF.md.
   Safety model: values live in two separate stores – `demo` (never leaves the page) and `desk` (only what the
   mixer reported). The single write path is set()/act(); it needs LIVE on, a value the mixer already reported,
   and a hand gesture in the last 1.5 s. Nothing is ever derived and written back. */
const DW = 1180, APP_VER = '0.1.1';
const NATIVE = window.XAirNative || null;
const APK_URL = 'https://github.com/netchamo/wing-console/releases/download/xair-latest/air-console.apk';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pad2 = n => String(n).padStart(2, '0');
const capture = e => { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} };
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- OSC ---------- */
const TE = new TextEncoder(), TD = new TextDecoder();
const oscStr = s => { const b = TE.encode(s), o = new Uint8Array((b.length + 4) & ~3); o.set(b); return o; };
function oscMsg(addr, args = []) {
  const parts = [oscStr(addr), oscStr(',' + args.map(a => a[0]).join(''))];
  for (const [t, v] of args) {
    if (t === 's') parts.push(oscStr(String(v)));
    else { const b = new Uint8Array(4), d = new DataView(b.buffer); if (t === 'f') d.setFloat32(0, v); else d.setInt32(0, v | 0); parts.push(b); }
  }
  let n = 0; parts.forEach(p => { n += p.length; });
  const o = new Uint8Array(n); let k = 0; parts.forEach(p => { o.set(p, k); k += p.length; });
  return o;
}
function oscParse(u) {
  const d = new DataView(u.buffer, u.byteOffset, u.byteLength); let p = 0;
  const str = () => { let e = p; while (e < u.length && u[e]) e++; const s = TD.decode(u.subarray(p, e)); p = (e + 4) & ~3; return s; };
  const addr = str(); if (addr[0] !== '/') return null;
  const args = []; let types = '';
  if (p < u.length && u[p] === 44) {
    types = str().slice(1);
    for (const t of types) {
      if (t === 'i') { args.push(d.getInt32(p)); p += 4; }
      else if (t === 'f') { args.push(d.getFloat32(p)); p += 4; }
      else if (t === 's') args.push(str());
      else if (t === 'b') { const n = d.getInt32(p); p += 4; args.push(u.subarray(p, p + n)); p += (n + 3) & ~3; }
      else break;
    }
  }
  return { addr, types, args };
}
const b64 = u => { let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };

/* ---------- value laws (float 0..1 as the mixer keeps it) ---------- */
const STEPS = { fader: 1024, level: 161, pan: 101 };
/* a hand value snapped to the mixer's own grid, as the float32 the mixer will hold */
const q = (v, n) => Math.fround(Math.round(clamp(v, 0, 1) * (n - 1)) / (n - 1));
function dbOf(v) {
  if (!(v > 0)) return -Infinity;
  if (v >= 0.5) return v * 40 - 30;
  if (v >= 0.25) return v * 80 - 50;
  if (v >= 0.0625) return v * 160 - 70;
  return v * 480 - 90;
}
function posOf(d) {
  if (!(d > -90)) return 0;
  if (d >= -10) return clamp((d + 30) / 40, 0, 1);
  if (d >= -30) return (d + 50) / 80;
  if (d >= -60) return (d + 70) / 160;
  return (d + 90) / 480;
}
const dbText = v => { if (v === undefined) return '···'; const d = dbOf(v); return d === -Infinity ? '-∞' : (d > 0.04 ? '+' : '') + (Math.abs(d) < 0.05 ? '0.0' : d.toFixed(1)); };
const panText = v => { if (v === undefined) return '···'; const p = Math.round(v * 100) * 2 - 100; return p === 0 ? 'C' : (p < 0 ? 'L' : 'R') + Math.abs(p); };
const same = (a, b) => a === b || (typeof a === 'number' && typeof b === 'number' && Math.abs(a - b) < 1e-6);

/* ---------- models ---------- */
const MODELS = {
  XR18: { key: 'XR18', ch: 16, bus: 6, rec: false, aux: 'AUX IN' },
  XR16: { key: 'XR16', ch: 16, bus: 6, rec: true, aux: 'USB' },
  XR12: { key: 'XR12', ch: 12, bus: 2, rec: true, aux: 'USB' }
};
const modelKey = m => /18/.test(m || '') ? 'XR18' : /16/.test(m || '') ? 'XR16' : /12/.test(m || '') ? 'XR12' : 'XR18';
const isXAir = m => /^(XR|MR|X)-?(12|16|18)/i.test(m || '');

/* mixer colour 0–15: OFF RD GN YE BL MG CY WH, +8 = inverted */
const COLORS = ['#7d7466', '#e0513f', '#62b85c', '#e6c23e', '#4a8ee8', '#d868d8', '#45c9cc', '#e9e2d0'];
const nameLook = c => {
  if (c === undefined) return 'background:#2c2721;color:#8c8272';
  const col = COLORS[c & 7];
  return c & 8 ? `background:#141210;color:${col};box-shadow:inset 0 0 0 1.5px ${col}` : `background:${col};color:#121110`;
};
const solPath = k => '/-stat/solosw/' + pad2(k);
function mkStrip(kind, n, M) {
  const S = (b, o) => ({ kind, n, base: b, id: kind + (n || ''), fader: b + '/mix/fader', on: b + '/mix/on', name: b + '/config/name', color: b + '/config/color', ...o });
  if (kind === 'ch') return S('/ch/' + pad2(n), { def: 'CH ' + pad2(n), pan: '/ch/' + pad2(n) + '/mix/pan', solo: solPath(n), mt: [n - 1], sends: true });
  if (kind === 'aux') return S('/rtn/aux', { def: M.aux, pan: '/rtn/aux/mix/pan', solo: solPath(17), mt: [16, 17], sends: true });
  if (kind === 'rtn') return S('/rtn/' + n, { def: 'FX ' + n + ' RTN', pan: '/rtn/' + n + '/mix/pan', solo: solPath(17 + n), mt: [16 + 2 * n, 17 + 2 * n], sends: true });
  if (kind === 'bus') return S('/bus/' + n, { def: 'BUS ' + n, pan: '/bus/' + n + '/mix/pan', solo: solPath(39 + n), mt: [25 + n] });
  if (kind === 'fxs') return S('/fxsend/' + n, { def: 'FX ' + n + ' SEND', solo: solPath(45 + n), mt: [31 + n] });
  if (kind === 'dca') return S('/dca/' + n, { def: 'DCA ' + n, fader: '/dca/' + n + '/fader', on: '/dca/' + n + '/on', solo: solPath(50 + n), mt: [] });
  return S('/lr', { def: 'MAIN LR', pan: '/lr/mix/pan', solo: solPath(50), mt: [36, 37] });
}
const LAYOUT = {};
function layoutOf(key, nbus) {
  const lk = key + ':' + (nbus || 0); if (LAYOUT[lk]) return LAYOUT[lk];
  const M = MODELS[key], r = n => Array.from({ length: n }, (_, i) => i + 1);
  const ch = r(M.ch).map(n => mkStrip('ch', n, M)), aux = mkStrip('aux', 0, M), rtn = r(4).map(n => mkStrip('rtn', n, M)),
    bus = r(nbus || M.bus).map(n => mkStrip('bus', n, M)), fxs = r(4).map(n => mkStrip('fxs', n, M)), dca = r(4).map(n => mkStrip('dca', n, M)), lr = mkStrip('lr', 0, M);
  const all = [...ch, aux, ...rtn, ...bus, ...fxs, ...dca, lr], byId = {}; all.forEach(s => { byId[s.id] = s; });
  const banks = [{ label: 'In 1–8', col: '#7aa7e0', strips: ch.slice(0, 8), ins: true }, { label: 'In 9–' + M.ch, col: '#7aa7e0', strips: ch.slice(8), ins: true },
    { label: 'Returns', col: '#a993d9', strips: [aux, ...rtn], ins: true }, { label: 'Buses', col: '#c9a25a', strips: bus }, { label: 'FX · DCA', col: '#4fc9b7', strips: [...fxs, ...dca] }];
  /* send destinations: mix 01–06 are the buses, 07–10 the four FX sends */
  const dests = [...bus.map(s => ({ k: s.n, label: 'BUS ' + s.n, col: '#c9a25a', strip: s })), ...fxs.map(s => ({ k: 6 + s.n, label: 'FX ' + s.n, col: '#4fc9b7', strip: s }))];
  return (LAYOUT[lk] = { M, ch, aux, rtn, bus, fxs, dca, lr, all, byId, banks, dests });
}
const sendPath = (s, d) => s.base + '/mix/' + pad2(d.k) + '/level';
const corePaths = s => [s.name, s.color, s.fader, s.on, s.solo, ...(s.pan ? [s.pan] : [])];

/* every address the mixer report asks for (reads only). Network keys and passwords are left out on purpose. */
function dumpPaths() {
  const P = [], r = n => Array.from({ length: n }, (_, i) => i + 1), add = (b, xs) => xs.forEach(x => P.push(b + '/' + x));
  const eq = (b, n) => { r(n).forEach(k => add(`${b}/eq/${k}`, ['type', 'f', 'g', 'q'])); P.push(b + '/eq/on'); };
  const dyn = b => add(b + '/dyn', ['on', 'mode', 'det', 'env', 'thr', 'ratio', 'knee', 'mgain', 'attack', 'hold', 'release', 'mix', 'auto', 'keysrc', 'filter/on', 'filter/type', 'filter/f']);
  const sends = b => r(10).forEach(k => add(`${b}/mix/${pad2(k)}`, ['level', 'pan', 'tap', 'grpon']));
  const core = b => add(b, ['config/name', 'config/color', 'mix/fader', 'mix/on', 'mix/pan', 'mix/lr', 'grp/dca', 'grp/mute']);
  r(16).forEach(n => { const b = '/ch/' + pad2(n); core(b); add(b, ['config/insrc', 'config/rtnsrc', 'preamp/hpf', 'preamp/hpon', 'preamp/invert', 'preamp/rtnsw', 'preamp/rtntrim', 'insert/on', 'insert/fxslot', 'automix/group', 'automix/weight']);
    add(b + '/gate', ['on', 'mode', 'thr', 'range', 'attack', 'hold', 'release', 'keysrc', 'filter/on', 'filter/type', 'filter/f']); dyn(b); eq(b, 4); sends(b); });
  r(18).forEach(n => add('/headamp/' + pad2(n), ['gain', 'phantom']));
  ['/rtn/aux', ...r(4).map(n => '/rtn/' + n)].forEach(b => { core(b); add(b, ['config/rtnsrc', 'preamp/rtnsw', 'preamp/rtntrim']); eq(b, 4); sends(b); });
  r(6).forEach(n => { const b = '/bus/' + n; core(b); dyn(b); eq(b, 6); add(b, ['eq/mode', 'insert/on', 'insert/fxslot']); });
  core('/lr'); dyn('/lr'); eq('/lr', 6); add('/lr', ['eq/mode', 'insert/on', 'insert/fxslot']);

        <div class="pop" role="alertdialog" style=${`z-index:9;left:340px;top:${Math.round((Hd - 250) / 2)}px;width:500px;padding:22px;gap:14px;border-color:#ff7a3d`}>
          <span style="font-size:24px;font-weight:700;letter-spacing:.04em;color:#ffb08a">Turn on live control?</span>
          <span dir="rtl" style=${`${HEB};font-size:16px;line-height:1.55;color:#d9cdb3`}>מרגע זה כל שינוי שתעשה ביד באפליקציה ישנה את המיקסר עצמו: פיידרים, מיוט, סולו, פאן ושליחות. שום דבר לא נשלח בלי פעולה שלך, וערך שהמיקסר עוד לא דיווח עליו לא יישלח.</span>
          <div style="display:flex;gap:10px">
            <button class="pill" style="flex:1;height:50px" onClick=${() => this.setState({ liveAsk: false })}>Cancel</button>
            <button class="pill" style="flex:1;height:50px;background:#ff7a3d;color:#1a0d05;border-color:#ff7a3d" onClick=${() => this.goLive()}>Turn on</button>
          </div>
        </div>`}`;
  }

  /* a strip's window: pan and its sends. The full channel screens (EQ, gate, compressor) come in the next stage. */
  renderSheet(Hd) {
    const st = this.state, L = this.L(), s = L.byId[st.sheet]; if (!s) return null;
    const nm = this.val(s.name), col = this.val(s.color), pan = s.pan ? this.val(s.pan) : undefined, H = Math.min(Hd - 40, 500), FH = H - 150, T = FH - 44, W = s.sends ? 110 + L.dests.length * 84 + 66 : 420;
    const close = () => this.setState({ sheet: null });
    return html`
      <button class="scrim" style="z-index:6" aria-label="Close" onClick=${close}></button>
      <div class="pop" style=${`z-index:7;left:${Math.round((DW - W) / 2)}px;top:${Math.round((Hd - H) / 2)}px;width:${W}px;height:${H}px;padding:14px 16px;gap:12px`}>
        <div style="display:flex;align-items:center;gap:12px;flex:none">
          <span class="tag" style=${nameLook(col) + ';height:34px;font-size:19px;min-width:120px'}>${nm || s.def}</span>
          <span style="font-size:13px;letter-spacing:.14em;color:#b8a78a;text-transform:uppercase">${s.def}</span>
          <div style="flex:1"></div>
          <button class="small" onClick=${close}>CLOSE</button>
        </div>
        <div style="flex:1;min-height:0;display:flex;gap:14px">
          <div style="width:${s.sends ? 110 : 380}px;flex:none;display:flex;flex-direction:column;gap:8px">
            ${s.pan && html`<span style="font-size:11px;letter-spacing:.16em;color:#b8a78a">PAN</span>
            <button class="panmini" style="height:44px;border-radius:22px" aria-label=${'Pan ' + panText(pan)} onPointerDown=${e => this.panDown(s.pan, e)} onPointerMove=${e => this.panMove(e)} onPointerUp=${() => this.panUp()} onPointerCancel=${() => this.panUp()}>
              <span style="position:absolute;left:50%;top:9px;bottom:9px;width:1px;background:#4a4339"></span>
              <span style="position:absolute;left:18px;right:18px;top:0;bottom:0">${pan !== undefined && html`<span class="knob" style=${`left:${pan * 100}%;width:26px;height:26px;margin:-13px 0 0 -13px`}></span>`}</span>
            </button>
            <span style="font-family:var(--mono);font-size:14px;text-align:center;color:#f1e7d2">${panText(pan)}</span>`}
            <div style="flex:1"></div>
            <span dir="rtl" style=${`${HEB};font-size:12.5px;line-height:1.4;color:#8c8272`}>איקיו, גייט וקומפרסור: בשלב הבא</span>
          </div>
          ${s.sends && html`<div style="flex:1;min-width:0;display:flex;gap:4px;padding:8px;border-radius:8px;background:#141210;border:1px solid var(--line)">
            ${L.dests.map(d => { const p = sendPath(s, d), v = this.val(p), dn = this.val(d.strip.name);
              return html`<div style="width:80px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px">
                <span style=${`font-size:10px;font-weight:700;letter-spacing:.14em;color:${d.col}`}>${d.label}</span>
                <span style="font-size:13px;font-weight:700;color:#f1e7d2;max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px">${dn || ''}</span>
                <span class="dbr">${dbText(v)}</span>
                <button class="fader" data-f=${p} style=${`height:${FH}px;width:80px`} aria-label=${d.label + ' send ' + dbText(v)}
                  onPointerDown=${e => this.faderDown({ path: p, steps: STEPS.level }, e, T, FH)} onPointerMove=${e => this.faderMove(e)} onPointerUp=${() => this.faderUp()} onPointerCancel=${() => this.faderUp()}>
                  <span class="slot" style="left:37px"></span>
                  ${v !== undefined && html`<span class="cap" style=${`left:20px;top:${Math.round((1 - v) * T)}px`}></span>`}
                </button></div>`; })}
          </div>`}
        </div>
      </div>`;
  }

  renderConn(Hd) {
    const st = this.state, c = st.conn, H = Math.min(Hd - 30, 440), close = () => this.setState({ connPop: false });
    const T = { demo: 'מצב הדגמה. חיבור למיקסר אפשרי רק מתוך אפליקציית האנדרואיד.', search: c.wifi ? 'מחפש מיקסר ברשת… בינתיים מצב הדגמה.' : 'אין רשת Wi‑Fi. התחבר לרשת של המיקסר.', connected: 'מחובר למיקסר.', lost: 'המיקסר לא עונה. ממשיך לנסות.' }[c.status];
    const row = 'display:flex;align-items:center;gap:10px';
    return html`
      <button class="scrim" style="z-index:8" aria-label="Close" onClick=${close}></button>
      <div class="pop" dir="rtl" style=${`z-index:9;left:${(DW - 620) / 2}px;top:${Math.round((Hd - H) / 2)}px;width:620px;max-height:${H}px;padding:18px 20px;gap:12px;${HEB};overflow:auto`}>
        <div style=${row}><span style="font-size:22px;font-weight:700;color:var(--brass-hi);flex:1">חיבור למיקסר</span><button class="small" onClick=${close}>סגור</button></div>
        <span style="font-size:16px;line-height:1.5;color:#d9cdb3">${T}</span>
        ${this.linked() && html`<div style="font-size:15px;line-height:1.6;color:#f1e7d2;padding:10px 12px;border-radius:8px;background:#141210;border:1px solid var(--line)">
          <div>דגם: <b dir="ltr">${c.model}</b></div><div>שם: <b dir="ltr">${c.name || '—'}</b></div><div>כתובת: <b dir="ltr">${c.ip}</b> · גרסה: <b dir="ltr">${c.fw || '—'}</b></div>
          <div>מצב: <b>${c.live ? 'שליטה חיה פעילה' : 'קריאה בלבד'}</b> · נשלחו <b dir="ltr">${this.sent}</b> שינויים</div></div>`}
        ${NATIVE && !this.linked() && c.found.length > 0 && html`<div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:14px;color:#b8a78a">מיקסרים שנמצאו:</span>
          ${c.found.map(f => html`<button class="pill" style="height:48px;text-transform:none;display:flex;align-items:center;gap:10px;padding:0 14px" onClick=${() => this.connect(f)}><b dir="ltr">${f.model}</b><span dir="ltr" style="flex:1;text-align:left">${f.name}</span><span dir="ltr" style="font-family:var(--mono);font-size:13px">${f.ip}</span></button>`)}</div>`}
        ${NATIVE && html`<div style=${row}>
          <input dir="ltr" value=${st.ipText} onInput=${e => this.setState({ ipText: e.target.value })} placeholder="192.168.1.1" inputmode="decimal"
            style="flex:1;height:44px;padding:0 12px;border-radius:8px;border:1px solid #3a342c;background:#100f0d;color:#f1e7d2;font-family:var(--mono);font-size:16px" />
          <button class="pill" style="padding:0 16px" onClick=${() => this.manual(st.ipText)}>חבר לכתובת</button></div>
        <div style=${row + ';flex-wrap:wrap'}>
          ${!this.linked() && html`<button class="pill" style="padding:0 16px;flex:1" onClick=${() => this.search()}>חפש שוב</button>`}
          ${this.linked() && html`<button class="pill" style="padding:0 16px;flex:1" onClick=${() => this.disconnect()}>נתק</button>`}
          <button class="pill" style="padding:0 16px;flex:1" onClick=${() => { try { NATIVE.openWifi(); } catch (e) {} }}>הגדרות Wi‑Fi</button>
        </div>
        <span dir="ltr" style="font-family:var(--mono);font-size:12px;color:#8c8272;text-align:left">${(() => { try { return 'this device: ' + (NATIVE.wifiAddress() || 'no local network'); } catch (e) { return ''; } })()}</span>`}
      </div>`;
  }

  renderSettings(Hd) {
    const st = this.state, c = st.conn, d = st.dump, sec = 'flex:1;min-width:0;gap:10px;' + HEB, h = 'font-size:18px;font-weight:700;color:var(--brass-hi)', p = 'font-size:14.5px;line-height:1.55;color:#d9cdb3';
    return html`
      <header class="topbar" style="height:52px;gap:10px">
        <div class="wood" style="width:18px;align-self:stretch"></div>
        <button class="navbtn hot backbtn" onClick=${() => this.setState({ screen: 'main' })} aria-label="Back to the mixer">${IC.back}<span>Mixer</span></button>
        <span style="font-size:22px;font-weight:700;letter-spacing:.06em;flex:1">SETTINGS</span>
        ${this.connPill()}
      </header>
      <div style="flex:1;min-height:0;display:flex;gap:10px;padding:12px 26px" dir="rtl">
        <div class="sec" style=${sec}>
          <span style=${h}>המיקסר</span>
          <span style=${p}>${this.linked() ? html`מחובר: <b dir="ltr">${c.model}</b> · <b dir="ltr">${c.name || '—'}</b> · <span dir="ltr">${c.ip}</span>` : 'לא מחובר. הדגם מזוהה לבד בחיבור, והמיקסר האחרון נזכר לפעם הבאה.'}</span>
          <button class="pill" onClick=${() => this.setState({ connPop: true, screen: 'main' })}>חיבור למיקסר</button>
          <span style=${h + ';margin-top:8px'}>מצב הדגמה</span>
          <span style=${p}>הדגם שמוצג כשאין חיבור. מה שמשחקים בהדגמה נשאר באפליקציה ולא נשלח לעולם.</span>
          <div style="display:flex;gap:6px" dir="ltr">${Object.keys(MODELS).reverse().map(k => html`<button class=${'pill' + (st.prefs.demoModel === k ? ' on' : '')} style="flex:1" onClick=${() => { this.demoInit(k); this.setPref({ demoModel: k }); this.setState({ bank: 0, sofOn: false, sof: 0 }); }}>${k}</button>`)}</div>
        </div>
        <div class="sec" style=${sec}>
          <span style=${h}>דוח מיקסר</span>
          <span style=${p}>קורא מהמיקסר את כל הערכים (קריאה בלבד, לא משנה דבר) ומכין טקסט להעתקה. הדוח הזה מאפשר לוודא שהאפליקציה קוראת נכון את המיקסר שלך לפני שבונים את המסכים הבאים.</span>
          <button class="pill" disabled=${!!(d && !d.done)} onClick=${() => this.dumpStart()}>${d && !d.done ? `קורא ${d.n} מתוך ${d.total}` : 'הכן דוח'}</button>
          ${d && d.done && html`<span style=${p}>הדוח מוכן: ענו <b dir="ltr">${d.n}</b> מתוך <b dir="ltr">${d.total}</b>. הוא מחולק לחלקים קצרים, כי הדבקה ארוכה נחתכת. העתק והדבק כל חלק בנפרד.</span>
            ${(this.dumpParts || []).map((t, k) => html`<button class="pill on" onClick=${() => this.copyText(t, `חלק ${k + 1} הועתק. הדבק אותו בשיחה`)}>העתק חלק ${k + 1} מתוך ${d.parts}</button>`)}`}
          <button class="pill" style="margin-top:auto" onClick=${() => this.copyText(this.logs.join('\n'), 'היומן הועתק')}>העתק יומן חיבור</button>
        </div>
        <div class="sec" style=${sec}>
          <span style=${h}>האפליקציה</span>
          <span style=${p}>גרסת ממשק <b dir="ltr">${APP_VER}</b>${NATIVE ? html` · גרסת אפליקציה <b dir="ltr">${(() => { try { return NATIVE.version(); } catch (e) { return ''; } })()}</b>` : ''}</span>
          <span style=${p}>האפליקציה קוראת בלבד עד שמדליקים LIVE. גם אז נשלח רק מה שמשנים ביד.</span>
          ${NATIVE && html`<button class="pill" onClick=${() => { try { NATIVE.checkUpdate(); } catch (e) {} this.toast('בודק עדכונים'); }}>בדוק עדכון</button>
          <button class="pill" onClick=${() => NATIVE.reload()}>טען מחדש את הממשק</button>`}
          <span style=${p + ';margin-top:auto;color:#8c8272'}>בשלבים הבאים: מסכי ערוץ, נגן ומקליט USB, אפקטים.</span>
        </div>
      </div>
      ${st.connPop && this.renderConn(Hd)}`;
  }

  render() {
    try { const v = this.renderApp(); this.rErr = 0; return v; }
    catch (e) {
      this.rErr = (this.rErr || 0) + 1;
      try { this.log('err', 'screen error on ' + this.state.screen + ': ' + String(e && e.message || e)); } catch (_) {}
      if (this.rErr < 3) setTimeout(() => this.setState({ screen: 'main', sheet: null, connPop: false, liveAsk: false, sofOn: false, toast: 'המסך הזה נתקל בנתון לא צפוי וחזרתי למיקסר' }), 0);
      return html`<div ref=${el => { if (el) this.stage = el; }} style="position:absolute;inset:0;background:#0b0a09"></div>`;
    }
  }
  renderApp() {
    const st = this.state, { s, Hd, offX } = this.dims(), portrait = st.ch > st.cw * 1.05;
    return html`
      <div ref=${el => { if (el) this.stage = el; }} style="position:absolute;inset:0">
        <div class="console" style=${`left:${offX}px;height:${Hd}px;transform:scale(${s})`}>
          ${st.screen === 'settings' ? this.renderSettings(Hd) : this.renderMain(Hd)}
        </div>
        ${!st.started && html`
          <div class="overlay" dir="rtl">
            <div class="card">
              <h1>AIR CONSOLE</h1>
              <p>מצב הדגמה: הנתונים מדומים. חיבור למיקסר נעשה מתוך אפליקציית האנדרואיד.</p>
              <button class="cta" onClick=${() => this.goFullscreen()}>פתח במסך מלא</button>
              <button class="ghost" onClick=${() => this.setState({ started: true })}>המשך בלי מסך מלא</button>
            </div>
          </div>`}
        ${st.started && portrait && html`<div class="overlay" dir="rtl" style="z-index:25"><div class="card"><h1 style="font-size:30px">⟲</h1><p>סובב את המכשיר לרוחב</p></div></div>`}
        ${st.toast && html`<div class="toast" role="status">${st.toast}</div>`}
      </div>`;
  }
}

render(html`<${App} />`, document.getElementById('stage'));
</script>

</body>
</html>
